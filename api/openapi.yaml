      run_id: { type: string }
      tool_event_id: { type: string }
      task_id: { type: string }
      kind: { type: string, enum: [before, after, checkpoint] }
      paths:
        type: array
        items:
          type: object
          properties:
            path: { type: string }
            hash: { type: string, description: 全局 CAS 内容哈希（absent=true 时为空） }
            size: { type: integer, format: int64 }
            absent: { type: boolean, description: true = 快照时文件不存在（恢复即删除） }
      size: { type: integer, format: int64 }
      created_at: { type: integer, format: int64 }
  Webhook:
    type: object
