openapi: 3.0.3
info:
  title: harness-go API
  version: 1.0.0
  description: |
    harness-go 单二进制服务的 HTTP 契约（**单一真源**：docs/开发实施计划.md §6 第 3 类协议）。

    冻结规则：
    - 本文件是前后端唯一物理边界，禁止口头约定字段；
    - 阶段 A 冻结后**只允许向后兼容的新增字段**；
    - 破坏性变更流程：改本文件 → 重新生成/校对 `web/src/lib/apiTypes.ts` → 双端同步。

    通用约定：
    - 鉴权：`Authorization: Bearer <token>` 或 Cookie `hg_sess`（HttpOnly, SameSite=Lax）。
    - 错误体统一：`{"error":{"code","message","trace_id","details"}}`，`trace_id` 与日志一致。
    - 时间戳一律为 Unix 毫秒（int64）。
    - 分页列表统一返回 `{"items":[...],"limit":N,"offset":M}`。
    - `Cache-Control: no-store`；SSE 端点除外（`no-cache`）。
servers:
  - url: /
    description: 同源部署（单二进制内置前端）
tags:
  - name: auth
    description: 认证与免登
  - name: sessions
    description: 会话
  - name: runs
    description: Run 与事件流
  - name: tools
    description: 工具契约与注入预算
  - name: ops
    description: 运维
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [ops]
      summary: 健康检查（免鉴权）
      security: []
      responses:
        "200":
          description: 服务状态与协议版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  protocol_version: { type: integer, example: 1 }
                  uptime_s: { type: integer }
  /:
    get:
      tags: [auth]
      summary: SPA 入口（同时承担 SSO 免登拦截与凭据剥离）
      description: |
        带 `user_name` 查询参数时：校验凭据 → `Set-Cookie` → **302 到不含凭据的干净 URL**；
        校验失败 302 `/?sso_error=1`（不区分「用户不存在/口令错误」）。
      security: []
      parameters:
        - name: user_name
          in: query
          schema: { type: string }
        - name: pwd
          in: query
          schema: { type: string }
        - name: ts
          in: query
          description: signed 模式的时间戳（|now-ts| ≤ 60s）
          schema: { type: integer }
        - name: sign
          in: query
          description: signed 模式的 HMAC-SHA256(user_name + "\n" + ts + "\n" + ip)
          schema: { type: string }
      responses:
        "302":
          description: 重定向到干净 URL（登录成功）或 /?sso_error=1（失败）
        "200":
          description: 未带凭据时返回前端静态资源
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 账号口令登录（返回令牌并写 Cookie）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string, description: 明文令牌仅此一次返回 }
                  expires_at: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/sso:
    post:
      tags: [auth]
      summary: SSO 免登（前端兜底的 URL 自愈路径）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name: { type: string }
                pwd: { type: string, format: password }
                ts: { type: integer }
                sign: { type: string }
      responses:
        "200":
          description: 免登成功（写 Cookie）
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户（首屏静默探测，避免闪登录页）
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（吊销当前令牌并清 Cookie）
      responses:
        "204": { description: 已退出 }
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 修改口令
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: 修改成功 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 会话列表（**只读主库摘要列**，绝不扫会话库）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 会话分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [sessions]
      summary: 新建会话（只写主库，首条消息才建 session.db）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                model_ref: { type: string }
                workspace_path: { type: string }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 会话详情
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sessions]
      summary: 更新会话（重命名 / 会话级模型 / 访问模式）
      description: |
        title、model_ref、access_mode 均可选：title 非空时重命名；model_ref 传 null 之外任意值
        （含空串）即更新会话级模型，空串表示「未选择」（省略字段则不改动模型）；
        access_mode 非空时更新访问模式（confirm/full），引擎每次审批实时重读，运行中切换立即生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                model_ref:
                  type: string
                  description: 会话级模型引用（providerID/modelID）；空串 = 未选择
                access_mode:
                  type: string
                  enum: [confirm, full]
                  description: 访问模式（变更前确认/完全访问）；非法值 400
      responses:
        "204": { description: 已更新 }
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [sessions]
      summary: 删除会话（主库软删 + 会话目录回收）
      responses:
        "204": { description: 已删除 }
  /api/v1/sessions/{sid}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: 归档会话（落库 sessions.archived_at；侧栏默认列表不再显示，归档中心可见；幂等）
      responses:
        "204": { description: 已归档 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/unarchive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: 取消归档（回到原分组；幂等）
      responses:
        "204": { description: 已取消归档 }
        "404":
          $ref: "#/components/responses/NotFound"
  # ============ 项目域（项目为服务端一等实体：默认控制权限 + 项目审批规则） ============
  /api/v1/projects:
    get:
      tags: [projects]
      summary: 项目列表（置顶优先，其次更新时间倒序）
      responses:
        "200": { description: 项目列表（items） }
    post:
      tags: [projects]
      summary: 新建项目（default_access_mode 缺省为 confirm）
      responses:
        "201": { description: 已创建 }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/projects/{pid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 取单个项目
      responses:
        "200": { description: 项目 }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      summary: 更新项目（名称 / 默认控制权限 / 置顶；缺省字段保留原值）
      responses:
        "204": { description: 已更新 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      summary: 删除项目（事务级联：软删 + 清规则 + 会话 project_id 归零）
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{pid}/approval-rules:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 项目审批规则列表
      responses:
        "200": { description: 规则列表（items） }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [projects]
      summary: 新增项目审批规则（命中即直接放行；重复添加幂等）
      responses:
        "201": { description: 已创建 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{pid}/approval-rules/{rid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
      - name: rid
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [projects]
      summary: 删除项目审批规则
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 消息列表（**以 DB 为准**；流式 delta 只是预览）
      parameters:
        - name: after_seq
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: 消息分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: Webhook 订阅列表（secret 脱敏，只回 has_secret；P1）
      responses:
        "200":
          description: 订阅列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
    post:
      tags: [webhooks]
      summary: 新增订阅（url + secret(HMAC) + 事件白名单；P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                secret: { type: string, description: HMAC-SHA256 签名密钥（明文只出现一次） }
                events:
                  type: array
                  items: { type: string, enum: [run.completed, run.failed, run.interrupted, approval.requested, tool.failed] }
                  description: 白名单（空 = 全部一期事件）
      responses:
        "201":
          description: 订阅（脱敏）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [webhooks]
      summary: 删除订阅
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/{id}/enable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [webhooks]
      summary: 启用订阅
      responses:
        "204": { description: 已启用 }
  /api/v1/webhooks/{id}/disable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [webhooks]
      summary: 停用订阅
      responses:
        "204": { description: 已停用 }
  /api/v1/webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [webhooks]
      summary: 联通测试（同步投递一条 webhook.test 事件，不重试）
      responses:
        "200":
          description: 投递结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer }
                  ok: { type: boolean }
  /v1/models:
    get:
      tags: [openai-compat]
      summary: OpenAI 兼容模型清单（enabled providers 聚合 + default；P1）
      responses:
        "200":
          description: OpenAI list 形状
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string }
                        created: { type: integer }
                        owned_by: { type: string }
  /v1/chat/completions:
    post:
      tags: [openai-compat]
      summary: OpenAI 兼容对话补全（stream:true 为 OpenAI chunk SSE；X-Session-ID 复用会话，否则映射隐藏会话；P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                stream: { type: boolean }
                stream_options:
                  type: object
                  properties:
                    include_usage: { type: boolean }
      responses:
        "200":
          description: 非流式为 chat.completion；流式为 text/event-stream（data: chunk / [DONE]）
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sid}/rollback:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: 物理回滚（G/S10：文件写回 + 消息级置灰；每次回滚登记审计事件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [tool, turn, message]
                  description: 回滚粒度（工具事件 / 一轮 Run / 回滚到消息）
                tool_event_id: { type: string, description: mode=tool 必填 }
                run_id: { type: string, description: mode=turn 必填 }
                message_seq: { type: integer, format: int64, description: mode=message 必填（该 seq 起的消息置灰） }
      responses:
        "200":
          description: 回滚事件（affected=快照对，restored=物理写回结果）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollback" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sid}/rollbacks:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 回滚事件列表（时间倒序，reapply 依据）
      responses:
        "200":
          description: 回滚事件
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Rollback" }
  /api/v1/sessions/{sid}/rollbacks/{rid}/reapply:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: rid
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [sessions]
      summary: 撤销一次回滚（恢复 after 快照 + 恢复置灰消息；不可重复执行）
      responses:
        "200":
          description: 更新后的回滚事件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollback" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sid}/snapshots:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 会话快照锚点（时间倒序；fs 写入 before/after 与长任务检查点）
      responses:
        "200":
          description: 快照锚点
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
  /api/v1/sessions/{sid}/active-run:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [runs]
      summary: 会话当前进行中的 Run（前端刷新后重建流式态/SSE 订阅的唯一事实来源）
      description: |
        语义铁律：**无进行中 Run 不是 404** —— 返回 200 且 `run_id` 为空串即表示空闲
        （与 `/sessions/{sid}/lease` 的 `active=false` 同口径），前端无需分支处理错误码。

        刻意不放在 `/runs/` 下：`GET /runs/active-run` 会被 `GET /runs/{rid}` 的通配吞掉。
      responses:
        "200":
          description: 查询成功（`run_id` 为空串 = 无进行中 Run）
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    description: 进行中的 Run ID；空串表示该会话当前空闲
                  status:
                    allOf:
                      - $ref: "#/components/schemas/RunStatus"
                    description: 仅 `run_id` 非空时有意义
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/runs:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [runs]
      summary: 发起 Run（异步；超并发不拒绝，置 pending 排队）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string }
                model_ref: { type: string }
                device_id:
                  type: string
                  description: |
                    执行端设备（C-6，可选）。非空表示该 Run 以该设备为会话租约持有者，
                    抢占旧端并使其 epoch+1 且收到 `lease.revoked`；缺省/空串 = 服务端本地执行面。
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { $ref: "#/components/schemas/RunStatus" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/runs/{rid}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Run 详情（状态机以 DB 为准）
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/runs/{rid}/stop:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [runs]
      summary: 停止 Run（幂等）
      responses:
        "204": { description: 已请求停止 }
  /api/v1/sessions/{sid}/runs/{rid}/guidance:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [runs]
      summary: 运行中引导（需求 §4.2）
      description: |
        用户消息立即落库（响应返回该消息），引擎在**轮次边界**回灌上下文——
        当前流结束后模型即看到该引导。Run 已结束 → 409；输入为空 → 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, description: 引导内容（trim 后非空） }
      responses:
        "201":
          description: 已落库的引导消息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Run 不在运行中，无法引导
  /api/v1/sessions/{sid}/runs/{rid}/events:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Run 事件流（SSE，支持 Last-Event-ID 断线续传）
      description: |
        事件帧格式：`id: <seq>\nevent: <type>\ndata: <json>\n\n`。
        `delta` 不落库（预览通道）；终端对齐走 `resync` 事件后重拉 `/messages`。
        慢消费者缓冲满会被主动断开（绝不阻塞 Run）。
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/sessions/{sid}/runs/{rid}/tool-events:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: 工具调用事件（回放与审计）
      responses:
        "200":
          description: 工具事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ToolEvent" }
  /api/v1/tools:
    get:
      tags: [tools]
      summary: 工具注册表快照（tier / default_tier / cost_tokens / health / 软上限告警）
      responses:
        "200":
          description: 注册表快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolSnapshot" }
        "503":
          $ref: "#/components/responses/ToolUnavailable"
  /api/v1/tools/injection:
    get:
      tags: [tools]
      summary: 本轮注入视图与 token 预算明细
      description: core 全量定义 / deferred 仅名称索引（约 18 token/条）/ on_demand 零注入。
      responses:
        "200":
          description: 注入预算明细
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolInjection" }
        "503":
          $ref: "#/components/responses/ToolUnavailable"
  /api/v1/tools/tiers:
    patch:
      tags: [tools]
      summary: 调整工具档位（写入主库 settings.tools.tiers，**下一轮对话生效**）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers]
              properties:
                tiers:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/ToolTier"
                  example: { echo: on_demand }
      responses:
        "200":
          description: 调整后的注册表快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolSnapshot" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ToolUnavailable"
  # ===== 核心 SOP（agent-core）：出厂内置 + 运行时覆盖 =====
  /api/v1/sop/core:
    get:
      tags: [sop]
      summary: 核心 SOP 生效快照（来源 / token / 预算 / 出厂原文）
      description: |
        source=builtin 表示使用**出厂内置**（embed，永不落盘）；
        source=custom 表示存在运行时覆盖 data/sop/agent-core.md。
        前端「系统内置」页签渲染 builtin_content，故切换页签**不需要任何读写请求**。
      responses:
        "200":
          description: 生效快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [sop]
      summary: 保存自定义核心 SOP（首次保存即完成「内置 → 自定义」fork，下一轮对话生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 核心 SOP 全文（空内容会被拒绝，恢复出厂请用 DELETE）
      responses:
        "200":
          description: 保存后的生效快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [sop]
      summary: 重置为出厂内置（删除运行时覆盖层，完整 undo）
      responses:
        "200":
          description: 重置后的生效快照（source 必为 builtin）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sop/effective:
    get:
      tags: [sop]
      summary: 生效预览（核心 SOP + 项目级条目 + token 合计），不跑对话即可确认改动生效
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
          description: 给出时按该会话绑定的工作区列出项目级条目；缺省只列核心 SOP
      responses:
        "200":
          description: 生效预览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPEffective" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  # ===== 阶段 C：设备与多端协同（HALO M5） =====
  /api/v1/devices/pair-codes:
    post:
      tags: [devices]
      summary: 生成 6 位配对码（TTL 120s，一次性消费）
      description: |
        管理端签发配对码，端侧凭码配对。有效期由 `devices.pair_ttl_s` 决定（默认 120s）。
        设备域关闭时返回 503 `device.disabled`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 预置设备名提示（端侧可覆盖） }
                kind: { $ref: "#/components/schemas/DeviceKind" }
      responses:
        "201":
          description: 配对码已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairCode" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/pair:
    post:
      tags: [devices]
      summary: 端侧凭码配对，换取 device_token（**免用户鉴权**，凭码即凭据）
      description: |
        配对码不存在 / 已消费 / 已过期 / 格式非法，**一律**返回 401 `device.pair_code_invalid`
        （防枚举，不区分具体原因）。同一来源失败 6 次/分钟 → 429 `rate_limited`。
        device_token 明文仅在此响应中出现一次，服务端只存 sha256。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6 位数字配对码 }
                name: { type: string }
                kind: { $ref: "#/components/schemas/DeviceKind" }
                platform: { type: string, description: 如 windows / darwin / linux }
                app_version: { type: string }
                capabilities:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: string }
      responses:
        "201":
          description: 配对成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "401":
          description: 配对码无效（不存在/已消费/已过期均同码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/fs/roots:
    get:
      tags: [fs]
      summary: 列出工作区宿主可浏览的根目录（L0 服务端宿主）
      description: |
        工作区宿主（WorkspaceHost）目录列举契约，见 `docs/工作区宿主与目录选择对接约定.md`。

        - `host=server`（缺省）= 服务端本地列举，范围受白名单 `HARNESS_FS_ROOTS` 约束；
        - `host=device:<id>` = 客户端宿主，**L1 未实现前统一返回 409 `fs.host_unsupported`**
          （绝不静默降级为服务端本地列举，否则会把服务端目录列进客户端空间）。
        - **只读**：仅目录元数据，不读任何文件内容。
      parameters:
        - { name: host, in: query, required: false, schema: { type: string }, description: "server | device:<id>" }
      responses:
        "200":
          description: 根目录列表
          content:
            application/json:
              schema:
                type: object
                required: [host, separator, roots]
                properties:
                  host: { type: string }
                  separator: { type: string, description: "路径分隔符：Windows \\\\，POSIX /" }
                  roots:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/FsHostUnsupported"
  /api/v1/fs/dirs:
    get:
      tags: [fs]
      summary: 列出工作区宿主某个目录下的子目录
      description: |
        - **只返回目录**，文件一律不出现（本端点是目录选择器，不是文件浏览器）；
        - 路径必须为绝对路径，含 `..` 段一律 400 `fs.path_denied`；
        - 到白名单根层级时 `parent` 为 `null`（绝不返回 `..`）；
        - 目录过多时截断并置 `truncated: true`；
        - `path` 为空表示「尚未定位」，只回 `roots` 供前端从根开始浏览。
      parameters:
        - { name: host, in: query, required: false, schema: { type: string }, description: "server | device:<id>" }
        - { name: path, in: query, required: false, schema: { type: string }, description: 绝对路径（宿主本地口径） }
      responses:
        "200":
          description: 目录列表
          content:
            application/json:
              schema:
                type: object
                required: [host, path, separator, dirs]
                properties:
                  host: { type: string }
                  path: { type: string }
                  parent: { type: string, nullable: true, description: "已在根层级时为 null" }
                  separator: { type: string }
                  roots:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
                  dirs:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
                  truncated: { type: boolean }
        "400":
          $ref: "#/components/responses/FsPathDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FsHostUnsupported"
  /api/v1/devices:
    get:
      tags: [devices]
      summary: 设备列表（含离线/已吊销与能力项；**不回传令牌摘要**）
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/{did}:
    delete:
      tags: [devices]
      summary: 吊销设备（令牌立即失效并断开长连接）
      description: 已吊销或不存在均返回 404 `device.not_found`（幂等语义外的不可重复成功）。
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 已吊销
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/ws:
    get:
      tags: [devices]
      summary: 设备长连接（端 → 服出站 WS 升级；**免用户鉴权**，凭 device_token）
      description: |
        鉴权**在升级前**完成（`devices.token_hash` + 未吊销），失败返回 **401 JSON 而非 101**。
        令牌经 query `?token=` 传递（WS 无法自定义请求头）；access log 的 query 白名单不含 `token`，
        故设备令牌永不落日志。帧格式见 docs/protocols.md §6。
        心跳：端每 `heartbeat_s`(默认 15s) 发 `ping{load, capabilities_hash, protocol_version}`，
        服务端回 `pong{server_time, pending}` 并刷新 `last_seen_at`；`offline_after_s`(默认 45s) 无帧判离线。
        协议不兼容（服务端支持 N / N-1）→ 回 `error{code: "device.protocol_mismatch"}` 后关闭连接。
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: 配对时下发的 device_token 明文（仅端侧使用，浏览器端请勿持有）
      responses:
        "101":
          description: 已升级为 WebSocket（`task.dispatch` / `task.progress` / `task.result` / `lease.revoked`）
        "401":
          description: 设备令牌无效或已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/sessions/{sid}/lease:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 查询会话租约（跨端写者归属 / epoch）
      description: |
        **无租约不是 404**：语义为「当前无跨端写者，服务端本地可写」，
        以 `active=true / epoch=0 / holder=""` 返回，前端可直接展示而无需分支。
      responses:
        "200":
          description: 租约视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLease" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/settings/maintenance:
    get:
      tags: [ops]
      summary: 运维统计（库大小 / 打开会话库数 / 待审批数 / 未完成 Run）
      responses:
        "200":
          description: 运维统计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  # ===== B-3 审批决策 =====
  /api/v1/sessions/{sid}/runs/{rid}/approvals/{aid}/decide:
    post:
      tags: [runs]
      summary: 提交审批决策（allow_once / allow_session / deny）
      description: |
        aid = 等待中的审批 ID（= tool_events.id）。
        Run 必须处于 waiting_approval，否则 409；Gate 未命中（已处理/已超时）404。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: rid, in: path, required: true, schema: { type: string } }
        - { name: aid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: 决策已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  # ===== B-4 模型厂商 =====
  /api/v1/providers:
    get:
      tags: [providers]
      summary: 列出模型厂商（api_key 恒为空，has_api_key 表示是否已配置）
      responses:
        "200":
          description: 厂商列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      tags: [providers]
      summary: 新增模型厂商
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/providers/{pid}:
    patch:
      tags: [providers]
      summary: 更新模型厂商（api_key 留空表示保留原密钥）
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: 更新后的厂商
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [providers]
      summary: 删除模型厂商
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/{pid}/test:
    post:
      tags: [providers]
      summary: 连通测试（用该厂商发一次极小 chat 请求，返回延迟与错误码）
      description: |
        base_url / api_key / models 为可选草稿覆盖：携带前端「尚未保存」的当前值实现所见即所测。
        厂商未落库（pid 不存在）时只要有 base_url 就按请求配置直接测；api_key 仅本次测试使用，不落库。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, description: 留空则用厂商首个模型 }
                base_url: { type: string, description: "可选：草稿里的 Base URL（未保存时以此为准；厂商不存在时必填）" }
                api_key: { type: string, description: "可选：草稿里刚输入未保存的密钥（仅本次测试使用，不落库）" }
                models:
                  type: array
                  items: { type: string }
                  description: "可选：草稿里的模型清单（未保存时以此为准）"
      responses:
        "200":
          description: 测试结果（业务失败也返回 200，ok=false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/{pid}/models:
    get:
      tags: [providers]
      summary: 获取上游真实模型清单（依次尝试 {base}/models、{base}/v1/models、{base}/api/tags）
      description: |
        兼容 OpenAI `{"data":[{"id":...}]}` 与 Ollama `{"models":[{"name":...}]}` 两种响应形状。
        Base URL 会自动剥离误填的 `/chat/completions`、`/messages`、`/responses` 后缀。
        **失败时直接返回错误（不回退任何本地兜底清单）**，让前端展示真实原因。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 上游模型清单
          headers:
            Cache-Control: { schema: { type: string }, description: 恒为 no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderModelsResult" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 上游全部候选均失败（错误信息含各候选的 HTTP 状态）
  /api/v1/providers/{pid}/secret:
    get:
      tags: [providers]
      summary: 读取厂商 API Key 明文（设置页「显示 / 复制」用）
      description: |
        供眼睛图标明文展示与一键复制。需已登录（Bearer/Cookie），只返回该厂商自身密钥。
        响应强制 `Cache-Control: no-store` + `Referrer-Policy: no-referrer`，明文不落 access log。
        未配置密钥时返回空串且 `has_key=false`（不是错误）。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 密钥明文
          headers:
            Cache-Control: { schema: { type: string }, description: 恒为 no-store }
            Referrer-Policy: { schema: { type: string }, description: 恒为 no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSecretResult" }
        "404":
          $ref: "#/components/responses/NotFound"
  # ===== B-4 通用配置 / 统计 / 日志 =====
  /api/v1/settings:
    get:
      tags: [settings]
      summary: 读取白名单配置键（未设置的键不返回）
      responses:
        "200":
          description: 配置项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsMap" }
    patch:
      tags: [settings]
      summary: 批量写入配置（键必须命中白名单，值必须为合法 JSON）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 写入后的全量白名单配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsMap" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/stats:
    get:
      tags: [ops]
      summary: 统计面板数据（会话数 / 打开会话库 / 运行中 Run / 待审批 / 主库统计）
      responses:
        "200":
          description: 统计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/logs:
    get:
      tags: [ops]
      summary: 文本运维日志查询（倒序早停，仅返回尾部 N 行，永不返回全文）
      description: |
        支持时间范围（from/to，Unix 毫秒）、级别、trace_id、关键字与分页。
        响应额外携带保留策略元信息（retention_days / earliest_available_day / snapshot_mode），
        供界面明示「日志在线保留 N 天、更早数据已清理」——禁止前端硬编码这些数字。
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: level, in: query, schema: { type: string, enum: [error, warn, info, debug] } }
        - { name: traceId, in: query, schema: { type: string }, description: 按 trace_id 检索（排障主入口） }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, schema: { type: integer }, description: Unix 毫秒（0 = 不限） }
        - { name: to, in: query, schema: { type: integer }, description: Unix 毫秒（0 = 不限） }
      responses:
        "200":
          description: 日志行 + 保留策略元信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        level: { type: string }
                        text: { type: string }
                  total: { type: integer }
                  has_more: { type: boolean }
                  retention_days: { type: integer, description: 在线保留天数（超期自动清理） }
                  earliest_available_day: { type: string, description: 最早可查天键 YYYYMMDD }
                  snapshot_mode: { type: string, enum: [off, preview, full] }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/logs/config:
    get:
      tags: [ops]
      summary: 读取报文抓取档位与保留策略（含预估日增与当前占用）
      responses:
        "200":
          description: 日志配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogConfig" }
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [ops]
      summary: 切换报文抓取档位 / 调整保留天数（运行时生效）
      description: |
        切换仅影响之后的新调用：切到 full 不补录历史；切到 off 不删除已有数据。
        非法取值返回 400（不静默兜底，避免"以为切成功了"的静默失效）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot_mode: { type: string, enum: [off, preview, full] }
                retention_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/tool-events:
    get:
      tags: [ops]
      summary: 跨会话工具调用审计（按时间范围，无需 run_id）
      description: |
        数据源是天分片日志库族的 tool_call_logs（会话库 tool_events 的查询副本）。
        副本可丢弃：丢失只影响本端点，不影响业务。默认时间范围为最近 24 小时。
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 审计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  retention_days: { type: integer }
                  earliest_available_day: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/llm-calls:
    get:
      tags: [ops]
      summary: LLM 调用流水（跨会话全局查询；session_id 可选）
      description: |
        数据源为天分片日志库族的 llm_requests（与单会话兼容别名
        `/api/v1/sessions/{sid}/llm-trace` 指向同一 handler）。
        默认时间范围为最近 24 小时。正文是否可得取决于当前抓取档位：
        preview 只存脱敏摘要与校验值，full 才有正文；不可得时返回 payload_hint。
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 调用流水
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  payload: { type: string }
                  payload_hint: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stats/tokens:
    get:
      tags: [ops]
      summary: Token 用量聚合（按模型/厂商/天，数据源为小时预聚合表）
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: group_by, in: query, schema: { type: string, enum: [model, provider, day], default: model } }
      responses:
        "200":
          description: 聚合结果（estimated_calls 显式暴露估算占比）
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: integer }
                  to: { type: integer }
                  group_by: { type: string }
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total_calls: { type: integer }
                  total_prompt_tokens: { type: integer }
                  total_completion_tokens: { type: integer }
                  total_cached_tokens: { type: integer }
                  total_tokens: { type: integer }
                  estimated_calls: { type: integer }
                  earliest_day: { type: string }
                  latest_day: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/sessions/{sid}/llm-trace:
    get:
      tags: [ops]
      summary: 报文回溯（按 message/run/trace 回查当时的模型入参出参）
      description: |
        数据源为天分片日志库族的 llm_requests。正文是否可得取决于当前抓取档位：
        preview 只存脱敏摘要与校验值，full 才有正文；不可得时返回 payload_hint 说明原因。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string }, description: 单条精确回查时顺带取正文 }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 报文记录（含 payload 全文或不可得原因）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  payload: { type: string }
                  payload_hint: { type: string }
                  snapshot_mode: { type: string, enum: [off, preview, full] }
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============ 阶段 E：外部插件与工具市场 ============
  /api/v1/mcp/servers:
    get:
      tags: [mcp]
      summary: MCP Server 列表（配置 + 运行态；env/headers 只回键名不回值）
      responses:
        "200":
          description: Server 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MCPServerView" }
        "503": { description: 外部插件子系统未接入 }
    post:
      tags: [mcp]
      summary: 新增 MCP Server（?start=true 时立即启动；cloud 形态 stdio 被拒）
      parameters:
        - { name: start, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "400": { description: 参数非法 }
        "503": { description: 外部插件子系统未接入 }
  /api/v1/mcp/test:
    post:
      tags: [mcp]
      summary: 联通测试（配置可未落库）：建连→握手→tools/list→清理；可读失败原因
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: 测试结果（工具清单 + 耗时 + Server 自述）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPTestResult" }
        "400": { description: 参数非法 }
        "502": { description: 连接/握手/协议失败（可读原因） }
  /api/v1/mcp/servers/{id}:
    get:
      tags: [mcp]
      summary: 单个 Server 视图
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "404": { description: 不存在 }
    put:
      tags: [mcp]
      summary: 全量更新（变更后需显式 reload 生效）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "404": { description: 不存在 }
    delete:
      tags: [mcp]
      summary: 删除（先注销工具再关连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/reload:
    post:
      tags: [mcp]
      summary: 热重载（原子替换；新连接失败保留旧连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已重载 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/enable:
    post:
      tags: [mcp]
      summary: 启用并启动注册
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已启用 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/disable:
    post:
      tags: [mcp]
      summary: 停用（注销工具 + 关连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已停用 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/health:
    get:
      tags: [mcp]
      summary: 健康详情（状态/最近错误/调用数/失败数/工具数）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPHealth" }
        "404": { description: 不存在 }
  /api/v1/packages:
    get:
      tags: [packages]
      summary: 已安装工具包列表
      responses:
        "200":
          description: 包列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackageView" }
        "503": { description: 外部插件子系统未接入 }
  /api/v1/packages/install:
    post:
      tags: [packages]
      summary: 安装本地工具包 zip（签名校验 + 信任策略；未签名默认被拒）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 服务端本地 zip 路径 }
      responses:
        "201":
          description: 安装结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { $ref: "#/components/schemas/PackageView" }
                  signed: { type: boolean }
                  tools: { type: integer }
        "400": { description: 参数非法 }
        "409": { description: 同版本已安装 }
        "400": { description: 包格式/签名/信任策略拒绝（可读原因） }
  /api/v1/packages/{id}:
    delete:
      tags: [packages]
      summary: 卸载（注销工具 + 清目录 + 删行，索引一致）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已卸载 }
        "404": { description: 不存在 }
  /api/v1/packages/{id}/rollback:
    post:
      tags: [packages]
      summary: 回滚到上一版本（旧版本目录在升级时保留）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 回滚后视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageView" }
        "404": { description: 不存在 }
  /api/v1/packages/{id}/enable:
    post:
      tags: [packages]
      summary: 启用（重连注册）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已启用 }
  /api/v1/packages/{id}/disable:
    post:
      tags: [packages]
      summary: 禁用（注销工具，保留安装）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已禁用 }
  /api/v1/artifacts/{id}:
    get:
      tags: [artifacts]
      summary: 制品下载（按快照 CAS 引用寻址，返回二进制流）
      description: |
        id 即 sha256 十六进制串（`^[a-f0-9]{64}$`），服务端按 `hash[:2]` 分桶从全局 CAS 读取。
        响应带 `Content-Disposition: attachment` 与 `X-Content-Type-Options: nosniff`。
        诚实边界：仅做全局鉴权 + 资源存在性校验，**未实现**细粒度数据权限（session_export/fs_outside）与下载审计写库。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
        "200":
          description: 制品二进制流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: id 非法（非 64 位小写十六进制，含路径穿越尝试） }
        "401": { description: 未鉴权 }
        "404": { description: CAS 中不存在该内容 }
        "503": { description: 制品子系统未接入 }
  /api/v1/sessions/{sid}/export:
    get:
      tags: [artifacts]
      summary: 会话导出为 zip 包（含消息 / tool_events / Run / 快照 blob 引用）
      description: |
        复用内核 `service.BundleService.Export`（与 session-bundle 插件 `export_session` 同一执行体），
        包内已含 `manifest.json` / `messages.jsonl` / `runs.json` / `tool_events.jsonl` / `blobs/**`。
        诚实边界：契约提及的 `session_export` 数据权限当前不存在，仅做全局鉴权 + 会话存在性校验。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [zip], default: zip } }
      responses:
        "200":
          description: 会话导出 zip 流
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { description: format 非 zip }
        "401": { description: 未鉴权 }
        "404": { description: 会话不存在 }
        "503": { description: 会话导出子系统未接入 }
  /api/v1/data/backup:
    get:
      tags: [artifacts]
      summary: 全量数据备份为 zip 归档（owner 专用）
      description: |
        归档相对 dataDir 的全部数据：`backup-manifest.json` + `main.db` + `sessions/<sid>/session.db` + blob CAS + 其余数据文件。
        跳过 `-wal` / `-shm` / `data/tmp/**` / `*.part` / `restore-staging-*` / 备份产物自身。
        诚实边界：**文件级**归档而非 SQLite 事务快照，语义为「最后一次 checkpoint 的落盘状态」，建议低写入窗口触发。
      responses:
        "200":
          description: 备份 zip 流
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: 未鉴权 }
        "403": { description: 非 owner 角色 }
        "500": { description: 归档失败 }
        "503": { description: 备份子系统未接入 }
  /api/v1/data/restore:
    post:
      tags: [artifacts]
      summary: 从备份 zip 恢复（校验 + 暂存，owner 专用）
      description: |
        安全边界：**不直接覆盖生产 data/**。流程为 ① 落 `data/tmp/*.part` → ② 整体校验（路径归一拒绝 `..`/绝对路径/反斜杠/盘符、拒绝符号链接、
        单条目 ≤512MiB、总量 ≤2GiB、条目数 ≤50000、路径去重、必须含 `backup-manifest.json` 且含 `main.db`、schema 1..1）
        → ③ 解压到独立暂存目录 `data/restore-staging-<ts>` → ④ 校验清单与 `main.db` 可读。
        任一步失败即 `RemoveAll(staging)` 清理。返回 `staging_path` + `requires_restart=true`，替换由停机运维执行。
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: 恢复校验通过，返回暂存路径
          content:
            application/json:
              schema:
                type: object
                properties:
                  staging_path: { type: string, description: 暂存目录绝对路径 }
                  entries: { type: integer, description: 解压条目数 }
                  bytes: { type: integer, format: int64 }
                  skipped: { type: integer }
                  requires_restart: { type: boolean, description: 恒为 true（需停机替换） }
                  note: { type: string, description: 启用步骤说明 }
        "400": { description: 非 zip / 空体 / 非法 zip / 缺清单 / schema 越界 / 路径穿越条目 / 符号链接 / 超体积 }
        "401": { description: 未鉴权 }
        "403": { description: 非 owner 角色 }
        "503": { description: 备份子系统未接入 }

components:
  Rollback:
    type: object
    description: 一次回滚事件（审计 + reapply 依据；G/S10）
    properties:
      id: { type: string }
      mode: { type: string, enum: [tool, turn, message] }
      target: { type: string, description: 工具事件 ID / run_id / 消息 seq（文本） }
      affected:
        type: array
        description: 参与回滚的工具事件快照对
        items:
          type: object
          properties:
            tool_event_id: { type: string }
            run_id: { type: string }
            snapshot_before: { type: string }
            snapshot_after: { type: string }
            paths: { type: array, items: { type: string } }
      hidden_from_seq: { type: integer, format: int64, description: 消息级回滚的置灰起点（0=未置灰） }
      restored:
        type: array
        description: 物理写回结果
        items:
          type: object
          properties:
            path: { type: string }
            action: { type: string, enum: [restored, deleted] }
            bytes: { type: integer, format: int64 }
      created_at: { type: integer, format: int64 }
      reapplied_at: { type: integer, format: int64, nullable: true }
  Snapshot:
    type: object
    description: 全局快照锚点行（内容本体在 data/snapshots/blobs CAS；G/S10）
    properties:
      id: { type: string }
      session_id: { type: string }
      run_id: { type: string }
      tool_event_id: { type: string }
      task_id: { type: string }
      kind: { type: string, enum: [before, after, checkpoint] }
      paths:
        type: array
        items:
          type: object
          properties:
            path: { type: string }
            hash: { type: string, description: 全局 CAS 内容哈希（absent=true 时为空） }
            size: { type: integer, format: int64 }
            absent: { type: boolean, description: true = 快照时文件不存在（恢复即删除） }
      size: { type: integer, format: int64 }
      created_at: { type: integer, format: int64 }
  Webhook:
    type: object
    description: Webhook 订阅（P1；secret 只写不读）
    properties:
      id: { type: string }
      url: { type: string }
      has_secret: { type: boolean }
      events:
        type: array
        items: { type: string }
        description: 白名单（空 = 全部一期事件）
      enabled: { type: boolean }
      created_at: { type: integer, format: int64 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: hg_sess
  parameters:
    SessionID:
      name: sid
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: rid
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: 未认证或凭据无效（不区分「用户不存在/口令错误」）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: 状态冲突（如 Run 不在 waiting_approval）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: 触发限流（带 Retry-After）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ToolUnavailable:
      description: 工具子系统未接入
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unavailable:
      description: 对应子系统未接入（服务端装配缺失）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DeviceUnavailable:
      description: 设备域未接入或被配置关闭（`device.disabled`）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FsPathDenied:
      description: 路径越界或非法（`fs.path_denied`）：含 `..` 段、非绝对路径、或不在白名单 `HARNESS_FS_ROOTS` 内
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FsHostUnsupported:
      description: 宿主不具备目录列举能力（`fs.host_unsupported`）：`host=device:<id>` 在 L1 实现前返回此码
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    FsDirEntry:
      type: object
      description: 一个目录项（只含目录名与宿主本地绝对路径，不含任何文件元数据）
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
    # ============ 阶段 E：外部插件与工具市场 DTO ============
    MCPServerView:
      type: object
      description: MCP Server 视图（env/headers 只回键名不回值——安全边界）
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [stdio, sse, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env_keys: { type: array, items: { type: string } }
        cwd: { type: string }
        url: { type: string }
        header_keys: { type: array, items: { type: string } }
        enabled: { type: boolean }
        timeout_ms: { type: integer }
        max_output: { type: integer }
        default_risk: { type: string }
        allow_tools: { type: array, items: { type: string } }
        deny_tools: { type: array, items: { type: string } }
        health_interval_s: { type: integer }
        state: { type: string, enum: [ready, degraded, failed, disabled] }
        calls: { type: integer }
        failures: { type: integer }
        tool_count: { type: integer }
        last_error: { type: string }
    MCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, sse, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          description: 键值明文进、密文出库；API 响应永不回值
          additionalProperties: { type: string }
        cwd: { type: string }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
        timeout_ms: { type: integer }
        max_output: { type: integer }
        default_risk: { type: string, enum: [readonly, write, command, danger] }
        allow_tools: { type: array, items: { type: string } }
        deny_tools: { type: array, items: { type: string } }
        health_interval_s: { type: integer }
    MCPTestResult:
      type: object
      properties:
        tool_names: { type: array, items: { type: string } }
        elapsed_ms: { type: integer }
        server_info: { type: string }
    MCPHealth:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string }
        state: { type: string }
        last_error: { type: string }
        calls: { type: integer }
        failures: { type: integer }
        tool_count: { type: integer }
    PackageView:
      type: object
      description: 本地工具包视图（trust = signed | unsigned；builtin 不入库）
      properties:
        id: { type: string }
        version: { type: string }
        previous_version: { type: string }
        name: { type: string }
        trust: { type: string, enum: [signed, unsigned] }
        namespace: { type: string, example: "pkg:demo" }
        enabled: { type: boolean }
        description: { type: string }
        tool_names: { type: array, items: { type: string } }
        state: { type: string }
        last_error: { type: string }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_argument }
            message: { type: string }
            trace_id: { type: string }
            details: { type: object, additionalProperties: true }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    Session:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        workspace_path: { type: string }
        access_mode: { type: string, enum: [readonly, confirm, full] }
        model_ref: { type: string }
        user_id: { type: string }
        message_count: { type: integer, format: int64 }
        last_message_at: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
        last_run_status: { $ref: "#/components/schemas/RunStatus" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        archived_at:
          type: integer
          format: int64
          description: 归档时间（毫秒；缺省 = 未归档。归档中心可见，侧栏默认列表不显示）
    Message:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        run_id: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        reasoning: { type: string }
        tool_calls: { type: array, items: { type: object, additionalProperties: true } }
        tool_call_id: { type: string }
        attachments: { type: array, items: { type: object, additionalProperties: true } }
        token_count: { type: integer }
        usage: { type: object, additionalProperties: true }
        created_at: { type: integer, format: int64 }
    RunStatus:
      type: string
      enum: [pending, running, waiting_approval, completed, failed, cancelled, interrupted]
    Run:
      type: object
      properties:
        id: { type: string }
        trigger_type: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        stop_reason: { type: string }
        model_ref: { type: string }
        executor: { type: string, enum: [server, desktop, mobile, browser, any] }
        device_id: { type: string }
        parent_run_id: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_tokens: { type: integer, format: int64 }
        is_estimated: { type: boolean }
        error_code: { type: string }
        error_message: { type: string }
        started_at: { type: integer, format: int64 }
        ended_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
    ToolEvent:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        message_id: { type: string }
        tool_name: { type: string }
        namespace: { type: string, example: builtin }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true, description: "标准化结果：{content, meta?, cost_tokens?}" }
        result_blob: { type: string }
        status: { type: string, enum: [pending, approved, denied, running, ok, error, timeout] }
        risk: { $ref: "#/components/schemas/Risk" }
        executor: { type: string, enum: [server, desktop, mobile, browser, any] }
        device_id: { type: string }
        source_trust: { type: string, enum: [trusted, untrusted] }
        approved_by: { type: string }
        error: { type: string }
        started_at: { type: integer, format: int64 }
        ended_at: { type: integer, format: int64 }
    Risk:
      type: string
      enum: [readonly, write, command, danger]
    ToolTier:
      type: string
      enum: [core, deferred, on_demand]
    ToolSummary:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        tier: { $ref: "#/components/schemas/ToolTier" }
        default_tier: { $ref: "#/components/schemas/ToolTier" }
        cost_tokens: { type: integer }
        risk: { $ref: "#/components/schemas/Risk" }
        executor: { type: string }
        plugin_id: { type: string }
        health:
          type: object
          properties:
            status: { type: string, enum: [available, degraded, unavailable] }
            message: { type: string }
            checked_at: { type: string, format: date-time }
    ToolSnapshot:
      type: object
      properties:
        total: { type: integer }
        core:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }
        deferred:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }
        on_demand:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }
        cost_total: { type: integer }
        cost_core: { type: integer }
        cost_deferred: { type: integer }
        limits:
          type: object
          properties:
            core_soft: { type: integer }
            deferred_soft: { type: integer }
        warnings:
          type: array
          items: { type: string }
        plugins:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: string }
              kind: { type: string, enum: [builtin, mcp, http, package, wasm] }
              default_tier: { $ref: "#/components/schemas/ToolTier" }
              tools:
                type: array
                items: { type: string }
        overrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ToolTier" }
        generated_at: { type: string, format: date-time }
    ToolInjection:
      type: object
      properties:
        core:
          type: array
          items: { type: object, additionalProperties: true }
        deferred_index:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              cost_tokens: { type: integer }
        on_demand:
          type: array
          items: { type: object, additionalProperties: true }
        deferred_hidden:
          type: array
          items: { type: string }
        cost_core: { type: integer }
        cost_index: { type: integer }
        cost_total: { type: integer }
        limits:
          type: object
          properties:
            core_soft: { type: integer }
            deferred_soft: { type: integer }
        warnings:
          type: array
          items: { type: string }

    # ===== B-3 审批 =====
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow_once, allow_session, deny]
        reason: { type: string, description: 拒绝原因（会作为工具结果回传模型） }
        device_id:
          type: string
          description: |
            决策端设备 ID（C-7 跨端仲裁）。端侧 Runner 决策时填自身 device_id；浏览器/管理端留空
            表示服务端本地执行面。`devices.strict_approval_device=true` 时若与审批要求设备不一致
            返回 403 `approval.device_mismatch`。也可经 query `?device_id=` 传入（body 优先）。
    ApprovalDecisionResponse:
      type: object
      properties:
        approval_id: { type: string }
        decision: { type: string }
        status: { type: string, description: 恒为 accepted }
    # ===== B-4 厂商 =====
    Provider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        base_url: { type: string }
        api_key: { type: string, description: 出参恒为空（只入不留） }
        has_api_key: { type: boolean }
        models:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        created_at: { type: integer }
        updated_at: { type: integer }
    ProviderInput:
      type: object
      properties:
        name: { type: string }
        base_url: { type: string }
        api_key: { type: string, description: 留空表示保留原密钥 }
        models:
          type: array
          items: { type: string }
        enabled: { type: boolean, default: true }
    ProviderTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        model: { type: string }
        code: { type: string, description: 失败时的 llm 错误分类 }
        error: { type: string }
    ProviderModelsResult:
      type: object
      properties:
        items:
          type: array
          items: { type: string }
          description: 上游返回的模型 ID（已去重保序）
        count: { type: integer }
    ProviderSecretResult:
      type: object
      properties:
        api_key: { type: string, description: 密钥明文；未配置时为空串 }
        has_key: { type: boolean, description: 是否已配置密钥（false 时前端置灰复制按钮） }
    # ===== B-4 配置 =====
    SettingsMap:
      type: object
      properties:
        items:
          type: object
          description: 键到任意 JSON 片段（白名单键见 service.settingsWhitelist）
          additionalProperties: true
    # ===== 阶段 C 设备（HALO M5） =====
    DeviceKind:
      type: string
      enum: [desktop, tablet, mobile, cli, browser]
    DeviceStatus:
      type: string
      enum: [online, offline, revoked]
    Capability:
      type: object
      required: [name]
      properties:
        device_id: { type: string }
        name: { type: string }
        version: { type: string }
        updated_at: { type: integer, format: int64, description: Unix 毫秒 }
    PairCode:
      type: object
      required: [code, expires_at, ttl_s]
      properties:
        code: { type: string, description: 6 位数字，一次性消费 }
        expires_at: { type: integer, format: int64, description: Unix 毫秒 }
        ttl_s: { type: integer, description: 有效期（秒），默认 120 }
        device_name: { type: string }
        device_kind: { $ref: "#/components/schemas/DeviceKind" }
    PairResult:
      type: object
      required: [device_id, device_token, ws_path, protocol_version]
      properties:
        device_id: { type: string }
        device_token:
          type: string
          description: 明文仅此一次返回（前缀 hgd_），服务端只存 sha256
        ws_path: { type: string, description: 端侧长连接路径（出站 WS） }
        protocol_version: { type: integer, description: 设备协议版本，支持 N / N-1 }
    Device:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        platform: { type: string }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        capabilities_hash: { type: string, description: 能力集合摘要（顺序无关） }
        protocol_version: { type: integer }
        app_version: { type: string }
        load: { description: 端侧负载快照（JSON） }
        paired_at: { type: integer, format: int64 }
        last_seen_at: { type: integer, format: int64 }
        revoked_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    DeviceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        pair_ttl_s: { type: integer, description: 配对码有效期（秒） }
        heartbeat_s: { type: integer, description: 端侧 ping 间隔（秒） }
        offline_after_s: { type: integer, description: 无帧判离线阈值（秒） }
    SessionLease:
      type: object
      description: 会话租约视图（C-6）。无租约 = active=true / epoch=0 / holder=""。
      required: [session_id, holder, holder_kind, epoch, active]
      properties:
        session_id: { type: string }
        holder:
          type: string
          description: 写者归属设备 ID；空串表示服务端本地执行面
        holder_kind:
          type: string
          enum: [server, device]
          description: executor 语义，便于前端直接展示
        epoch:
          type: integer
          format: int64
          description: 写者纪元（换人或过期接管 +1；同持有者续期不变）
        active:
          type: boolean
          description: 当前是否仍有效（false = 无写者或已过期，**不是错误**）
        expires_at: { type: integer, format: int64, description: 毫秒；0 = 无租约 }
        heartbeat_at: { type: integer, format: int64, description: 毫秒；0 = 无租约 }

    # ===== 核心 SOP（agent-core） =====
    SOPCore:
      type: object
      description: 核心 SOP 生效快照（出厂内置 embed 或运行时覆盖 data/sop/agent-core.md）
      properties:
        content: { type: string, description: 实际生效正文 }
        source:
          type: string
          enum: [builtin, custom]
          description: builtin = 出厂内置（永不落盘）；custom = 存在运行时覆盖
        tokens: { type: integer, description: 正文的启发式 token 估算 }
        budget: { type: integer, description: 总 token 预算（0 = 不限） }
        builtin_content: { type: string, description: 出厂原文（前端内置页签渲染它，切页签无需请求） }
        overridden: { type: boolean, description: 是否存在运行时覆盖（等价于「处于自定义模式」） }
    SOPEntry:
      type: object
      description: 项目级 SOP 条目（<ws>/.harness/sop/<id>.md）
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        tokens: { type: integer }
    SOPEffective:
      type: object
      description: 生效预览（核心 SOP + 项目级条目 + token 合计）
      properties:
        core: { $ref: "#/components/schemas/SOPCore" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SOPEntry" }
        workspace: { type: string, description: 会话绑定的工作区路径（空 = 未绑定） }
        total_tokens: { type: integer }
        system_preview: { type: string, description: 最终系统提示预览（基础提示 + SOP 段） }
        truncated: { type: boolean, description: 是否有条目因条数上限被截断（D10：必须可见） }
        entry_limit: { type: integer, description: 项目级条目条数上限 }
