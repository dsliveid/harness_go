      events:
        type: array
        items: { type: string }
        description: 白名单（空 = 全部一期事件）
      enabled: { type: boolean }
      created_at: { type: integer, format: int64 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: hg_sess
  parameters:
    SessionID:
      name: sid
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: rid
      in: path
      required: true
      schema: { type: string }
    WorkspaceID:
      name: wid
      in: path
      required: true
      description: 工作空间 ID（服务端内置空间恒为 `ws-server`；其余形如 `ws-<随机串>`）
      schema: { type: string }
      example: ws-server
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: 未认证或凭据无效（不区分「用户不存在/口令错误」）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: 状态冲突（如 Run 不在 waiting_approval）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: 触发限流（带 Retry-After）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ToolUnavailable:
      description: 工具子系统未接入
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unavailable:
      description: 对应子系统未接入（服务端装配缺失）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DeviceUnavailable:
      description: 设备域未接入或被配置关闭（`device.disabled`）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FsPathDenied:
      description: 路径越界或非法（`fs.path_denied`）：含 `..` 段、非绝对路径、或不在白名单 `HARNESS_FS_ROOTS` 内
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FsHostUnsupported:
      description: 宿主不具备目录列举能力（`fs.host_unsupported`）：`host=device:<id>` 在 L1 实现前返回此码
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    FsDirEntry:
      type: object
      description: 一个目录项（只含目录名与宿主本地绝对路径，不含任何文件元数据）
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
    # ============ 工作空间域 DTO（服务端为契约源头：字段以 Go struct 的 json tag 为准） ============
    Workspace:
      type: object
      description: |
        工作空间视图 = `model.Workspace`（internal/model/workspace.go）
        + `service.WorkspaceView` 的运行时派生字段（internal/service/workspace_service.go）。
        kind 是能力天花板依据，创建后不可修改（改 kind 等于提权）。

        **设备联动与能力三态（v2 契约）**：
        - 工作空间与设备严格一对一（同一设备只能有一个空间）；
        - `tool_policy` 是工具能力的**权威裁决**，前端不得按 online/kind 自行推导；
        - 无可用宿主（未绑定 / 离线 / 设备已删除 / 已解绑）时 `tool_policy=none`，
          但 `can_chat` 恒为 true——**可以对话，只是无法调用工具**；
        - 设备空间的所有工具都在**该设备**上执行，设备不可用时明确报错，
          绝不静默降级到服务端本地执行（执行面归属铁律）。
      required: [id, name, kind, device_id, root_path, online, host, bound, device_missing, device_revoked, tool_policy, can_chat, created_at, updated_at]
      properties:
        id:
          type: string
          description: 工作空间 ID；服务端内置空间恒为 `ws-server`
          example: ws-server
        name:
          type: string
          description: 展示名；创建时缺省取 kind
        kind:
          type: string
          enum: [server, desktop, mobile, browser]
          description: |
            工作空间类型（internal/model/workspace.go:10-19）。server 为唯一无需设备即可执行的空间；
            mobile 仅对话 + 图片识别。取值与前端 `WorkspaceKindDTO` 逐字一致，不引入 cli / tablet。
            绑定或切换设备时服务端校验 kind 与设备形态一致，不一致返回 400（防能力天花板错位/提权）。
        device_id:
          type: string
          description: 归属设备 ID；空串 = 服务端内置空间或未绑定设备的空间（后者 bound=false）
        root_path:
          type: string
          description: 宿主侧根目录；服务端内置空间为空串（磁盘路径在会话的 project_dir 上）
        online:
          type: boolean
          description: |
            派生字段，不落库。内置服务端空间（id=ws-server）恒 true；
            否则取设备 Hub 实时在线判定（Hub 未启用一律按离线 = fail-closed）。
        host:
          type: string
          description: 派生字段，不落库。设备空间为 `device:<device_id>`，服务端内置空间或未绑定空间为 `server`
          example: device:dev-abc123
        bound:
          type: boolean
          description: 是否有可用执行宿主。内置服务端空间恒 true；未绑定设备 / 设备已删除 / 已解绑时为 false
        device_name:
          type: string
          description: 归属设备名快照（未绑定或设备已删除时缺省）
        device_kind:
          type: string
          enum: [desktop, tablet, mobile, cli, browser]
          description: 归属设备形态快照
        device_status:
          type: string
          enum: [online, offline, revoked]
          description: 归属设备状态快照（设备域 devices.status）
        device_missing:
          type: boolean
          description: |
            绑定关系仍在但设备记录已不存在（已物理删除）。**与「离线」严格区分**：
            离线可恢复，已删除必须重新绑定。
        device_revoked:
          type: boolean
          description: 设备已解绑（devices.revoked_at 置位，不可恢复，需重新配对）
        last_seen_at:
          type: integer
          format: int64
          description: 设备最近活跃时间（Unix 毫秒）；未绑定或缺省表示未知
        tool_policy:
          type: string
          enum: [full, readonly, none]
          description: |
            **工具能力权威裁决**（internal/agent.ToolPolicy），前端不得自行推导：
            - full     全部工具（在线设备空间 / 内置服务端空间，仍受 kind 与审批链约束）；
            - readonly 仅 readonly 级工具（移动端、纯对话会话）；
            - none     零工具（未绑定 / 离线 / 已删除 / 已解绑）。
            引擎在审批评估**之前**短路拒绝越界工具，Run 继续执行（拒绝粒度是工具调用级）。
        policy_reason:
          type: string
          description: 策略降级的人类可读原因（可直接展示给用户）
        can_chat:
          type: boolean
          description: 是否可发起对话。**恒为 true**——无可用宿主也允许对话，只是没有工具能力
        created_at:
          type: integer
          format: int64
          description: Unix 毫秒
        updated_at:
          type: integer
          format: int64
          description: Unix 毫秒
    CreateWorkspaceReq:
      type: object
      description: |
        POST /api/v1/workspaces 请求体（internal/api/workspace_handler.go:26-33 createWorkspaceReq）。
        name 为空时服务端以 kind 作为名称；同一台设备只允许存在一个工作空间（重复建 409）。
      required: [kind]
      properties:
        name:
          type: string
          description: 展示名；空串 = 以 kind 作为名称
        kind:
          type: string
          enum: [server, desktop, mobile, browser]
          description: 必填；非法取值 400（绝不静默降级），创建后不可修改
        device_id:
          type: string
          description: 可选；非空必须对应一台已存在设备（否则 400 device.not_found）
        root_path:
          type: string
          description: 可选；宿主侧根目录，服务端内置空间留空串
    UpdateWorkspaceReq:
      type: object
      description: |
        PATCH /api/v1/workspaces/{wid} 请求体（internal/api/workspace_handler.go:96-101 updateWorkspaceReq）。
        全部字段可选，缺省 = 不改（服务端用 *string 承接，区分「未传」与「传空串」）。
        🚨 kind 不可修改：与原值相同幂等通过，不同立即 400。
      properties:
        name:
          type: string
          description: 新名称；传空串即置为空名（不做 kind 兜底）
        kind:
          type: string
          enum: [server, desktop, mobile, browser]
          description: 仅用于校验：必须与原值一致（幂等 PATCH），不同即 400（改 kind 等于提权）
        device_id:
          type: string
          description: 新归属设备；空串 = 改为服务端内置空间语义；非空必须对应已存在设备
        root_path:
          type: string
          description: 新根目录；传空串即清空
    # ============ 阶段 E：外部插件与工具市场 DTO ============
    MCPServerView:
      type: object
      description: MCP Server 视图（env/headers 只回键名不回值——安全边界）
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [stdio, sse, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env_keys: { type: array, items: { type: string } }
        cwd: { type: string }
        url: { type: string }
        header_keys: { type: array, items: { type: string } }
        enabled: { type: boolean }
        timeout_ms: { type: integer }
        max_output: { type: integer }
        default_risk: { type: string }
        allow_tools: { type: array, items: { type: string } }
        deny_tools: { type: array, items: { type: string } }
        health_interval_s: { type: integer }
        state: { type: string, enum: [ready, degraded, failed, disabled] }
        calls: { type: integer }
        failures: { type: integer }
        tool_count: { type: integer }
        last_error: { type: string }
    MCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, sse, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          description: 键值明文进、密文出库；API 响应永不回值
          additionalProperties: { type: string }
        cwd: { type: string }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
        timeout_ms: { type: integer }
        max_output: { type: integer }
        default_risk: { type: string, enum: [readonly, write, command, danger] }
        allow_tools: { type: array, items: { type: string } }
        deny_tools: { type: array, items: { type: string } }
        health_interval_s: { type: integer }
    MCPTestResult:
      type: object
      properties:
        tool_names: { type: array, items: { type: string } }
        elapsed_ms: { type: integer }
        server_info: { type: string }
    MCPHealth:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string }
        state: { type: string }
        last_error: { type: string }
        calls: { type: integer }
        failures: { type: integer }
        tool_count: { type: integer }
    PackageView:
      type: object
      description: 本地工具包视图（trust = signed | unsigned；builtin 不入库）
      properties:
        id: { type: string }
        version: { type: string }
        previous_version: { type: string }
        name: { type: string }
        trust: { type: string, enum: [signed, unsigned] }
        namespace: { type: string, example: "pkg:demo" }
        enabled: { type: boolean }
        description: { type: string }
        tool_names: { type: array, items: { type: string } }
        state: { type: string }
        last_error: { type: string }
    # ============ WebView 免登票据（internal/api/webview_ticket_handler.go） ============
    WebviewTicket:
      type: object
      description: |
        POST /api/v1/auth/webview-ticket 响应体（webview_ticket_handler.go:174-177）。
        ticket 明文**仅此一次返回**，服务端不落库、不写日志；重启即全部失效是可接受语义。
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
          description: 32 字节随机值的 base64url（无填充）编码，可直接放进 URL fragment
        expires_at:
          type: integer
          format: int64
          description: 过期时间，Unix 毫秒
    WebviewExchangeReq:
      type: object
      description: POST /api/v1/auth/webview-exchange 请求体（webview_ticket_handler.go:180-182）。
      required: [ticket]
      properties:
        ticket:
          type: string
          description: 由 webview-ticket 签发的票据明文；空串按无效处理（直接 401）
    WebviewExchangeResp:
      type: object
      description: |
        POST /api/v1/auth/webview-exchange 响应体（webview_ticket_handler.go:224）。
        **不含任何令牌字段**：会话凭据只通过 `Set-Cookie: hg_sess=...` 下发。
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 恒为 true（失败走统一错误体）
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_argument }
            message: { type: string }
            trace_id: { type: string }
            details: { type: object, additionalProperties: true }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    Session:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        project_dir: { type: string }
        access_mode: { type: string, enum: [readonly, confirm, full] }
        model_ref: { type: string }
        user_id: { type: string }
        message_count: { type: integer, format: int64 }
        last_message_at: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
        last_run_status: { $ref: "#/components/schemas/RunStatus" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        archived_at:
          type: integer
          format: int64
          description: 归档时间（毫秒；缺省 = 未归档。归档中心可见，侧栏默认列表不显示）
    Message:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        run_id: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        reasoning: { type: string }
        tool_calls: { type: array, items: { type: object, additionalProperties: true } }
        tool_call_id: { type: string }
        attachments: { type: array, items: { type: object, additionalProperties: true } }
        token_count: { type: integer }
        usage: { type: object, additionalProperties: true }
        created_at: { type: integer, format: int64 }
    RunStatus:
      type: string
      enum: [pending, running, waiting_approval, completed, failed, cancelled, interrupted]
    Run:
      type: object
      properties:
        id: { type: string }
        trigger_type: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        stop_reason: { type: string }
        model_ref: { type: string }
        executor: { type: string, enum: [server, desktop, mobile, browser, any] }
        device_id: { type: string }
        parent_run_id: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_tokens: { type: integer, format: int64 }
        is_estimated: { type: boolean }
        error_code: { type: string }
        error_message: { type: string }
        started_at: { type: integer, format: int64 }
        ended_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
    ToolEvent:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        message_id: { type: string }
        tool_name: { type: string }
        namespace: { type: string, example: builtin }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true, description: "标准化结果：{content, meta?, cost_tokens?}" }
        result_blob: { type: string }
        status: { type: string, enum: [pending, approved, denied, running, ok, error, timeout] }
        risk: { $ref: "#/components/schemas/Risk" }
        executor: { type: string, enum: [server, desktop, mobile, browser, any] }
        device_id: { type: string }
        source_trust: { type: string, enum: [trusted, untrusted] }
        approved_by: { type: string }
        error: { type: string }
        started_at: { type: integer, format: int64 }
        ended_at: { type: integer, format: int64 }
    Risk:
      type: string
