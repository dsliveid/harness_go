  # ===== 核心 SOP（agent-core）：出厂内置 + 运行时覆盖 =====
  /api/v1/sop/core:
    get:
      tags: [sop]
      summary: 核心 SOP 生效快照（来源 / token / 预算 / 出厂原文）
      description: |
        source=builtin 表示使用**出厂内置**（embed，永不落盘）；
        source=custom 表示存在运行时覆盖 data/sop/agent-core.md。
        前端「系统内置」页签渲染 builtin_content，故切换页签**不需要任何读写请求**。
      responses:
        "200":
          description: 生效快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [sop]
      summary: 保存自定义核心 SOP（首次保存即完成「内置 → 自定义」fork，下一轮对话生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 核心 SOP 全文（空内容会被拒绝，恢复出厂请用 DELETE）
      responses:
        "200":
          description: 保存后的生效快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [sop]
      summary: 重置为出厂内置（删除运行时覆盖层，完整 undo）
      responses:
        "200":
          description: 重置后的生效快照（source 必为 builtin）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPCore" }
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sop/effective:
    get:
      tags: [sop]
      summary: 生效预览（核心 SOP + 项目级条目 + token 合计），不跑对话即可确认改动生效
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
          description: 给出时按该会话绑定的工作区列出项目级条目；缺省只列核心 SOP
      responses:
        "200":
          description: 生效预览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SOPEffective" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  # ===== 阶段 C：设备与多端协同（HALO M5） =====
  /api/v1/devices/pair-codes:
    post:
      tags: [devices]
      summary: 生成 6 位配对码（TTL 120s，一次性消费）
      description: |
        管理端签发配对码，端侧凭码配对。有效期由 `devices.pair_ttl_s` 决定（默认 120s）。
        设备域关闭时返回 503 `device.disabled`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 预置设备名提示（端侧可覆盖） }
                kind: { $ref: "#/components/schemas/DeviceKind" }
      responses:
        "201":
          description: 配对码已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairCode" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/pair:
    post:
      tags: [devices]
      summary: 端侧凭码配对，换取 device_token（**免用户鉴权**，凭码即凭据）
      description: |
        配对码不存在 / 已消费 / 已过期 / 格式非法，**一律**返回 401 `device.pair_code_invalid`
        （防枚举，不区分具体原因）。同一来源失败 6 次/分钟 → 429 `rate_limited`。
        device_token 明文仅在此响应中出现一次，服务端只存 sha256。

        **配对后免二次登录**：配对码由已登录账号签发（`/devices/pair-codes` 需用户令牌），
        其授权者随码落库。故本端点在配对成功时会**额外**下发一份用户会话：
        `user_token` / `user` / `session_ttl_s` 三字段**同生共死**（要么全有、要么全无）。
        端侧拿到后直接进入已登录态，无需再走 `/auth/login`。

        三字段缺失是**合法降级**，不是错误：历史配对码（未记录授权者）、服务端未装配
        Auth、或签发失败时都会省略它们，此时**配对本身仍然成功**，端侧回落登录页。
        之所以不因签发失败而回滚配对：配对码已被一次性消费，回滚等于强迫用户重新配对，
        代价远大于多登录一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6 位数字配对码 }
                name: { type: string }
                kind: { $ref: "#/components/schemas/DeviceKind" }
                platform: { type: string, description: 如 windows / darwin / linux }
                app_version: { type: string }
                capabilities:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: string }
      responses:
        "201":
          description: 配对成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "401":
          description: 配对码无效（不存在/已消费/已过期均同码）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/session:
    post:
      tags: [devices]
      summary: 凭设备令牌续签用户会话（设备与账号持久绑定的续期入口）
      description: |
        `user_token` 会过期（`auth.session_ttl_h`，默认 168h = 7 天）。过期后端侧只剩
        `device_token`，而设备令牌**通不过** `/api/**` 的用户令牌中间件 —— 若无本端点，
        「配对即免登录」只能撑 7 天，之后用户被迫重新输密码，而设备其实还在。

        设备在配对时已记录归属账号（`devices.user_id`），故服务端能回答「该给谁续会话」。

        **鉴权（三条铁律）**：
        1. 本端点免全局鉴权（端侧没有用户令牌），但**不是**免鉴权：handler 内只认
           `Authorization: Bearer <device_token>` 并自行校验。
        2. **明确拒绝 Cookie 通道**：不接受 `hg_sess`，否则 WebView 的用户会话就能
           换取"刷会话"，绕开设备身份、也让吊销设备失效。
        3. 设备被吊销 / 令牌无效 → 401（不区分原因，防枚举）。

        **安全权衡（已知并已接受）**：本端点把 `device_token` 从"只能连 WS 执行面"
        提升为"可换业务会话"。之所以可接受：持有 device_token 本就等同于在宿主上获得
        执行权（可收 `task.dispatch` 执行 `fs.*` / `exec`），相对而言换取业务会话不是质变；
        且吊销设备即刻失效。缓解措施：签发的会话恒为 `kind=web_session` + `scope=write`
        （不授 admin），高危操作仍由审批闸门二次把关。

        **归属未知的存量设备**（0011 迁移之前配对，`user_id` 为空）返回 409
        `device.owner_unknown`：设备本身有效，但服务端不知道它属于谁，无法签发会话。
        端侧应引导重新配对，而不是让用户去登录页 —— 密码登进来的是"人"，
        而这里缺的是"机器属于谁"。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 续签成功（三字段同生共死，与配对响应形态一致）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionGrant" }
        "401":
          description: 设备令牌无效 / 已吊销 / 缺失（含误用 user_token 调用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: 设备归属账号未知（`device.owner_unknown`），需重新配对
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/fs/roots:
    get:
      tags: [fs]
      summary: 列出工作区宿主可浏览的根目录（L0 服务端宿主）
      description: |
        工作区宿主（WorkspaceHost）目录列举契约，见 `docs/工作区宿主与目录选择对接约定.md`。

        - `host=server`（缺省）= 服务端本地列举，范围受白名单 `HARNESS_FS_ROOTS` 约束；
        - `host=device:<id>` = 客户端宿主，**L1 未实现前统一返回 409 `fs.host_unsupported`**
          （绝不静默降级为服务端本地列举，否则会把服务端目录列进客户端空间）。
        - **只读**：仅目录元数据，不读任何文件内容。
      parameters:
        - { name: host, in: query, required: false, schema: { type: string }, description: "server | device:<id>" }
      responses:
        "200":
          description: 根目录列表
          content:
            application/json:
              schema:
                type: object
                required: [host, separator, roots]
                properties:
                  host: { type: string }
                  separator: { type: string, description: "路径分隔符：Windows \\\\，POSIX /" }
                  roots:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/FsHostUnsupported"
  /api/v1/fs/dirs:
    get:
      tags: [fs]
      summary: 列出工作区宿主某个目录下的子目录
      description: |
        - **只返回目录**，文件一律不出现（本端点是目录选择器，不是文件浏览器）；
        - 路径必须为绝对路径，含 `..` 段一律 400 `fs.path_denied`；
        - 到白名单根层级时 `parent` 为 `null`（绝不返回 `..`）；
        - 目录过多时截断并置 `truncated: true`；
        - `path` 为空表示「尚未定位」，只回 `roots` 供前端从根开始浏览。
      parameters:
        - { name: host, in: query, required: false, schema: { type: string }, description: "server | device:<id>" }
        - { name: path, in: query, required: false, schema: { type: string }, description: 绝对路径（宿主本地口径） }
      responses:
        "200":
          description: 目录列表
          content:
            application/json:
              schema:
                type: object
                required: [host, path, separator, dirs]
                properties:
                  host: { type: string }
                  path: { type: string }
                  parent: { type: string, nullable: true, description: "已在根层级时为 null" }
                  separator: { type: string }
                  roots:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
                  dirs:
                    type: array
                    items: { $ref: "#/components/schemas/FsDirEntry" }
                  truncated: { type: boolean }
        "400":
          $ref: "#/components/responses/FsPathDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FsHostUnsupported"
  /api/v1/devices:
    get:
      tags: [devices]
      summary: 设备列表（默认只含**未吊销**；不回传令牌摘要）
      description: |
        默认只返回**仍处于绑定关系**的设备（`revoked_at IS NULL`）。

        **解绑语义变更（双向收敛）**：此前本端点返回全部设备（含已吊销），导致管理端
        「解除绑定」后设备仍以红标卡片留在列表里，用户以为解绑没生效。现在吊销即从
        列表消失 —— 绑定关系的真源是 `devices.revoked_at`，列表只是它的投影。

        审计/运维需要看历史吊销记录时传 `include_revoked=true`。
      parameters:
        - name: include_revoked
          in: query
          required: false
          description: 为 true 时包含已吊销设备（审计用）。非法值按 false 处理，不报 400。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/unpair:
    post:
      tags: [devices]
      summary: 端侧自我解约（凭 device_token 吊销自己，**免用户令牌**）
      description: |
        **双向解绑的客户端方向**：端侧「解除本机绑定」时调用，把服务端的设备记录一并吊销。

        # 为什么必须是独立端点
        `DELETE /api/v1/devices/{did}` 走全局用户令牌中间件，而端侧解绑时手里只有
        `device_token`（user_token 可能已过期）→ 端侧解绑**结构上不可达**，
        只能清本地凭据、服务端记录原封不动（这就是「客户端取消绑定后服务端没取消」的根因）。

        # 鉴权
        只认 `Authorization: Bearer <device_token>`，**明确拒绝 Cookie**（防用 WebView
        的用户会话"替别人解绑"）。请求体为空：目标设备由令牌哈希反查，
        **不接受任何 deviceID**，物理上无法删别人的设备。

        # 幂等
        令牌无效 / 设备不存在 / 已吊销 → 一律 **204**（目标状态「本机不再绑定」已达成）。
        这与 `DELETE /devices/{did}` 的 404 刻意区分：端侧解绑不该因为"已经解绑了"而失败。
        仅令牌缺失/格式非法 → 401。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 已解绑（或本就未绑定）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/{did}:
    delete:
      tags: [devices]
      summary: 吊销设备（令牌立即失效并断开长连接）
      description: |
        管理端按 ID 吊销，**需用户令牌**。吊销后该设备即从 `GET /api/v1/devices` 的
        默认列表消失（= 解除绑定），并广播 SSE `device.revoked`。
        已吊销或不存在均返回 404 `device.not_found`（幂等语义外的不可重复成功）。
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 已吊销
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/ws:
    get:
      tags: [devices]
      summary: 设备长连接（端 → 服出站 WS 升级；**免用户鉴权**，凭 device_token）
      description: |
        鉴权**在升级前**完成（`devices.token_hash` + 未吊销），失败返回 **401 JSON 而非 101**。
        令牌经 query `?token=` 传递（WS 无法自定义请求头）；access log 的 query 白名单不含 `token`，
        故设备令牌永不落日志。帧格式见 docs/protocols.md §6。
        心跳：端每 `heartbeat_s`(默认 15s) 发 `ping{load, capabilities_hash, protocol_version}`，
        服务端回 `pong{server_time, pending}` 并刷新 `last_seen_at`；`offline_after_s`(默认 45s) 无帧判离线。
        协议不兼容（服务端支持 N / N-1）→ 回 `error{code: "device.protocol_mismatch"}` 后关闭连接。
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: 配对时下发的 device_token 明文（仅端侧使用，浏览器端请勿持有）
      responses:
        "101":
          description: 已升级为 WebSocket（`task.dispatch` / `task.progress` / `task.result` / `lease.revoked`）
        "401":
          description: 设备令牌无效或已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/devices/events:
    get:
      tags: [devices]
      summary: 设备状态实时推送（SSE；**需用户令牌**）
      description: |
        把设备的上下线变化实时推给观察侧（Web 前端），用于展示「当前哪些设备在线」。

        **与 `/sessions/{sid}/runs/{rid}/events` 是两套不同语义的流，勿混用**：
        - 后者是 per-Run 事件流（含 seq，支持 `Last-Event-ID` 续传）；
        - 本端点是设备状态**当前态**，**不支持续传** —— 重连即重拿全量快照。

        帧格式：
        ```
        event: snapshot
        data: {"type":"snapshot","all":[{"device_id","name","kind","online","last_seen_at"}],"at":<ms>}

        event: device.online
        data: {"type":"device.online","device":{...},"at":<ms>}

        event: device.offline
        data: {"type":"device.offline","device":{...},"at":<ms>}
        ```
        首帧固定为 `snapshot`（全量，按 `device_id` 排序），随后仅推**状态跃迁**。

        语义铁律：
        - 心跳**不推送**（每 15s 一次会让观察侧被无意义事件刷屏），只刷新 `last_seen_at`；
        - 同一设备重复上线/重复离线**不重复推送**（幂等），避免端侧重连造成事件风暴；
        - 同设备新连接接管旧连接 → 先 `offline` 再 `online`（不制造「一直在线」的假象）；
        - 慢消费者被服务端主动断开（缓冲满），浏览器重连后重拿快照即可；
        - 响应中**绝不含任何令牌字段**（红线 R3）。
      responses:
        "200":
          description: SSE 流（`text/event-stream`；每 15s 一条 `: ping` 注释保活）
          content:
            text/event-stream:
              schema:
                type: string
                description: 见上方的 snapshot / device.online / device.offline 帧格式
        "401":
          description: 缺少或无效的用户令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/sessions/{sid}/lease:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 查询会话租约（跨端写者归属 / epoch）
      description: |
        **无租约不是 404**：语义为「当前无跨端写者，服务端本地可写」，
        以 `active=true / epoch=0 / holder=""` 返回，前端可直接展示而无需分支。
      responses:
        "200":
          description: 租约视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLease" }
        "503":
          $ref: "#/components/responses/DeviceUnavailable"
  /api/v1/settings/maintenance:
    get:
      tags: [ops]
      summary: 运维统计（库大小 / 打开会话库数 / 待审批数 / 未完成 Run）
      responses:
        "200":
          description: 运维统计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  # ===== B-3 审批决策 =====
  /api/v1/sessions/{sid}/runs/{rid}/approvals/{aid}/decide:
    post:
      tags: [runs]
      summary: 提交审批决策（allow_once / allow_session / deny）
      description: |
        aid = 等待中的审批 ID（= tool_events.id）。
        Run 必须处于 waiting_approval，否则 409；Gate 未命中（已处理/已超时）404。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: rid, in: path, required: true, schema: { type: string } }
        - { name: aid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: 决策已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  # ===== B-4 模型厂商 =====
  /api/v1/providers:
    get:
      tags: [providers]
      summary: 列出模型厂商（api_key 恒为空，has_api_key 表示是否已配置）
      responses:
        "200":
          description: 厂商列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      tags: [providers]
      summary: 新增模型厂商
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/providers/{pid}:
    patch:
      tags: [providers]
      summary: 更新模型厂商（api_key 留空表示保留原密钥）
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: 更新后的厂商
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [providers]
      summary: 删除模型厂商
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/{pid}/test:
    post:
      tags: [providers]
      summary: 连通测试（用该厂商发一次极小 chat 请求，返回延迟与错误码）
      description: |
        base_url / api_key / models 为可选草稿覆盖：携带前端「尚未保存」的当前值实现所见即所测。
        厂商未落库（pid 不存在）时只要有 base_url 就按请求配置直接测；api_key 仅本次测试使用，不落库。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, description: 留空则用厂商首个模型 }
                base_url: { type: string, description: "可选：草稿里的 Base URL（未保存时以此为准；厂商不存在时必填）" }
                api_key: { type: string, description: "可选：草稿里刚输入未保存的密钥（仅本次测试使用，不落库）" }
                models:
                  type: array
                  items: { type: string }
                  description: "可选：草稿里的模型清单（未保存时以此为准）"
      responses:
        "200":
          description: 测试结果（业务失败也返回 200，ok=false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/{pid}/models:
    post:
      tags: [providers]
      summary: 获取上游真实模型清单（依次尝试 {base}/models、{base}/v1/models、{base}/api/tags）
      description: |
        兼容 OpenAI `{"data":[{"id":...}]}` 与 Ollama `{"models":[{"name":...}]}` 两种响应形状。
        Base URL 会自动剥离误填的 `/chat/completions`、`/messages`、`/responses` 后缀。
        **失败时直接返回错误（不回退任何本地兜底清单）**，让前端展示真实原因。

        方法为 **POST**（与 `router.go` 注册及前端 `api.ts` 调用一致）：因为需要携带草稿覆盖参数，
        请求体复用 `providerTestReq`（`provider_handler.go:140-145`）。空 body 合法（读库内已保存配置），
        同时为兼容旧 GET 调用/命令行调试保留了 query 传参（`?base_url=&api_key=`）。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
        - { name: base_url, in: query, required: false, schema: { type: string }, description: "兼容旧调用：草稿 Base URL（请求体同名字段优先）" }
        - { name: api_key, in: query, required: false, schema: { type: string }, description: "兼容旧调用：草稿密钥（仅本次使用，不落库）" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string, description: "可选：草稿里的 Base URL（未保存时以此为准）" }
                api_key: { type: string, description: "可选：草稿里刚输入未保存的密钥（仅本次使用，不落库）" }
      responses:
        "200":
          description: 上游模型清单
          headers:
            Cache-Control: { schema: { type: string }, description: 恒为 no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderModelsResult" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 上游全部候选均失败（错误信息含各候选的 HTTP 状态）
  /api/v1/providers/{pid}/secret:
    get:
      tags: [providers]
      summary: 读取厂商 API Key 明文（设置页「显示 / 复制」用）
      description: |
        供眼睛图标明文展示与一键复制。需已登录（Bearer/Cookie），只返回该厂商自身密钥。
        响应强制 `Cache-Control: no-store` + `Referrer-Policy: no-referrer`，明文不落 access log。
        未配置密钥时返回空串且 `has_key=false`（不是错误）。
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 密钥明文
          headers:
            Cache-Control: { schema: { type: string }, description: 恒为 no-store }
            Referrer-Policy: { schema: { type: string }, description: 恒为 no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSecretResult" }
        "404":
          $ref: "#/components/responses/NotFound"
  # ===== B-4 通用配置 / 统计 / 日志 =====
  /api/v1/settings:
    get:
      tags: [settings]
      summary: 读取白名单配置键（未设置的键不返回）
