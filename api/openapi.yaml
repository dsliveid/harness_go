            application/json:
              schema: { $ref: "#/components/schemas/SettingsMap" }
    patch:
      tags: [settings]
      summary: 批量写入配置（键必须命中白名单，值必须为合法 JSON）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 写入后的全量白名单配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsMap" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/stats:
    get:
      tags: [ops]
      summary: 统计面板数据（会话数 / 打开会话库 / 运行中 Run / 待审批 / 主库统计）
      responses:
        "200":
          description: 统计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/logs:
    get:
      tags: [ops]
      summary: 文本运维日志查询（倒序早停，仅返回尾部 N 行，永不返回全文）
      description: |
        支持时间范围（from/to，Unix 毫秒）、级别、trace_id、关键字与分页。
        响应额外携带保留策略元信息（retention_days / earliest_available_day / snapshot_mode），
        供界面明示「日志在线保留 N 天、更早数据已清理」——禁止前端硬编码这些数字。
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: level, in: query, schema: { type: string, enum: [error, warn, info, debug] } }
        - { name: traceId, in: query, schema: { type: string }, description: 按 trace_id 检索（排障主入口） }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, schema: { type: integer }, description: Unix 毫秒（0 = 不限） }
        - { name: to, in: query, schema: { type: integer }, description: Unix 毫秒（0 = 不限） }
      responses:
        "200":
          description: 日志行 + 保留策略元信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        level: { type: string }
                        text: { type: string }
                  total: { type: integer }
                  has_more: { type: boolean }
                  retention_days: { type: integer, description: 在线保留天数（超期自动清理） }
                  earliest_available_day: { type: string, description: 最早可查天键 YYYYMMDD }
                  snapshot_mode: { type: string, enum: [off, preview, full] }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/logs/config:
    get:
      tags: [ops]
      summary: 读取报文抓取档位与保留策略（含预估日增与当前占用）
      responses:
        "200":
          description: 日志配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogConfig" }
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [ops]
      summary: 切换报文抓取档位 / 调整保留天数（运行时生效）
      description: |
        切换仅影响之后的新调用：切到 full 不补录历史；切到 off 不删除已有数据。
        非法取值返回 400（不静默兜底，避免"以为切成功了"的静默失效）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot_mode: { type: string, enum: [off, preview, full] }
                retention_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/tool-events:
    get:
      tags: [ops]
      summary: 跨会话工具调用审计（按时间范围，无需 run_id）
      description: |
        数据源是天分片日志库族的 tool_call_logs（会话库 tool_events 的查询副本）。
        副本可丢弃：丢失只影响本端点，不影响业务。默认时间范围为最近 24 小时。
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 审计结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  retention_days: { type: integer }
                  earliest_available_day: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/llm-calls:
    get:
      tags: [ops]
      summary: LLM 调用流水（跨会话全局查询；session_id 可选）
      description: |
        数据源为天分片日志库族的 llm_requests（与单会话兼容别名
        `/api/v1/sessions/{sid}/llm-trace` 指向同一 handler）。
        默认时间范围为最近 24 小时。正文是否可得取决于当前抓取档位：
        preview 只存脱敏摘要与校验值，full 才有正文；不可得时返回 payload_hint。
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
        - { name: id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 调用流水
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  payload: { type: string }
                  payload_hint: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stats/tokens:
    get:
      tags: [ops]
      summary: Token 用量聚合（按模型/厂商/天，数据源为小时预聚合表）
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: group_by, in: query, schema: { type: string, enum: [model, provider, day], default: model } }
      responses:
        "200":
          description: 聚合结果（estimated_calls 显式暴露估算占比）
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: integer }
                  to: { type: integer }
                  group_by: { type: string }
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total_calls: { type: integer }
                  total_prompt_tokens: { type: integer }
                  total_completion_tokens: { type: integer }
                  total_cached_tokens: { type: integer }
                  total_tokens: { type: integer }
                  estimated_calls: { type: integer }
                  earliest_day: { type: string }
                  latest_day: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/sessions/{sid}/llm-trace:
    get:
      tags: [ops]
      summary: 报文回溯（按 message/run/trace 回查当时的模型入参出参）
      description: |
        数据源为天分片日志库族的 llm_requests。正文是否可得取决于当前抓取档位：
        preview 只存脱敏摘要与校验值，full 才有正文；不可得时返回 payload_hint 说明原因。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: message_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string }, description: 单条精确回查时顺带取正文 }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 报文记录（含 payload 全文或不可得原因）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  payload: { type: string }
                  payload_hint: { type: string }
                  snapshot_mode: { type: string, enum: [off, preview, full] }
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============ 阶段 E：外部插件与工具市场 ============
  /api/v1/mcp/servers:
    get:
      tags: [mcp]
      summary: MCP Server 列表（配置 + 运行态；env/headers 只回键名不回值）
      responses:
        "200":
          description: Server 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MCPServerView" }
        "503": { description: 外部插件子系统未接入 }
    post:
      tags: [mcp]
      summary: 新增 MCP Server（?start=true 时立即启动；cloud 形态 stdio 被拒）
      parameters:
        - { name: start, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "400": { description: 参数非法 }
        "503": { description: 外部插件子系统未接入 }
  /api/v1/mcp/test:
    post:
      tags: [mcp]
      summary: 联通测试（配置可未落库）：建连→握手→tools/list→清理；可读失败原因
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: 测试结果（工具清单 + 耗时 + Server 自述）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPTestResult" }
        "400": { description: 参数非法 }
        "502": { description: 连接/握手/协议失败（可读原因） }
  /api/v1/mcp/servers/{id}:
    get:
      tags: [mcp]
      summary: 单个 Server 视图
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "404": { description: 不存在 }
    put:
      tags: [mcp]
      summary: 全量更新（变更后需显式 reload 生效）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerView" }
        "404": { description: 不存在 }
    delete:
      tags: [mcp]
      summary: 删除（先注销工具再关连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/reload:
    post:
      tags: [mcp]
      summary: 热重载（原子替换；新连接失败保留旧连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已重载 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/enable:
    post:
      tags: [mcp]
      summary: 启用并启动注册
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已启用 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/disable:
    post:
      tags: [mcp]
      summary: 停用（注销工具 + 关连接）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已停用 }
        "404": { description: 不存在 }
  /api/v1/mcp/servers/{id}/health:
    get:
      tags: [mcp]
      summary: 健康详情（状态/最近错误/调用数/失败数/工具数）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPHealth" }
        "404": { description: 不存在 }
  /api/v1/packages:
    get:
      tags: [packages]
      summary: 已安装工具包列表
      responses:
        "200":
          description: 包列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackageView" }
        "503": { description: 外部插件子系统未接入 }
  /api/v1/packages/install:
    post:
      tags: [packages]
      summary: 安装本地工具包 zip（签名校验 + 信任策略；未签名默认被拒）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 服务端本地 zip 路径 }
      responses:
        "201":
          description: 安装结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { $ref: "#/components/schemas/PackageView" }
                  signed: { type: boolean }
                  tools: { type: integer }
        "400": { description: 参数非法 }
        "409": { description: 同版本已安装 }
        "400": { description: 包格式/签名/信任策略拒绝（可读原因） }
  /api/v1/packages/{id}:
    delete:
      tags: [packages]
      summary: 卸载（注销工具 + 清目录 + 删行，索引一致）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已卸载 }
        "404": { description: 不存在 }
  /api/v1/packages/{id}/rollback:
    post:
      tags: [packages]
      summary: 回滚到上一版本（旧版本目录在升级时保留）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 回滚后视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageView" }
        "404": { description: 不存在 }
  /api/v1/packages/{id}/enable:
    post:
      tags: [packages]
      summary: 启用（重连注册）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已启用 }
  /api/v1/packages/{id}/disable:
    post:
      tags: [packages]
      summary: 禁用（注销工具，保留安装）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已禁用 }
  /api/v1/artifacts/{id}:
    get:
      tags: [artifacts]
      summary: 制品下载（按快照 CAS 引用寻址，返回二进制流）
      description: |
        id 即 sha256 十六进制串（`^[a-f0-9]{64}$`），服务端按 `hash[:2]` 分桶从全局 CAS 读取。
        响应带 `Content-Disposition: attachment` 与 `X-Content-Type-Options: nosniff`。
        诚实边界：仅做全局鉴权 + 资源存在性校验，**未实现**细粒度数据权限（session_export/fs_outside）与下载审计写库。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
        "200":
          description: 制品二进制流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: id 非法（非 64 位小写十六进制，含路径穿越尝试） }
        "401": { description: 未鉴权 }
        "404": { description: CAS 中不存在该内容 }
        "503": { description: 制品子系统未接入 }
  /api/v1/sessions/{sid}/export:
    get:
      tags: [artifacts]
      summary: 会话导出为 zip 包（含消息 / tool_events / Run / 快照 blob 引用）
      description: |
        复用内核 `service.BundleService.Export`（与 session-bundle 插件 `export_session` 同一执行体），
        包内已含 `manifest.json` / `messages.jsonl` / `runs.json` / `tool_events.jsonl` / `blobs/**`。
        诚实边界：契约提及的 `session_export` 数据权限当前不存在，仅做全局鉴权 + 会话存在性校验。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [zip], default: zip } }
      responses:
        "200":
          description: 会话导出 zip 流
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { description: format 非 zip }
        "401": { description: 未鉴权 }
        "404": { description: 会话不存在 }
        "503": { description: 会话导出子系统未接入 }
  /api/v1/data/backup:
    get:
      tags: [artifacts]
      summary: 全量数据备份为 zip 归档（owner 专用）
      description: |
        归档相对 dataDir 的全部数据：`backup-manifest.json` + `main.db` + `sessions/<sid>/session.db` + blob CAS + 其余数据文件。
        跳过 `-wal` / `-shm` / `data/tmp/**` / `*.part` / `restore-staging-*` / 备份产物自身。
        诚实边界：**文件级**归档而非 SQLite 事务快照，语义为「最后一次 checkpoint 的落盘状态」，建议低写入窗口触发。
      responses:
        "200":
          description: 备份 zip 流
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: 未鉴权 }
        "403": { description: 非 owner 角色 }
        "500": { description: 归档失败 }
        "503": { description: 备份子系统未接入 }
  /api/v1/data/restore:
    post:
      tags: [artifacts]
      summary: 从备份 zip 恢复（校验 + 暂存，owner 专用）
      description: |
        安全边界：**不直接覆盖生产 data/**。流程为 ① 落 `data/tmp/*.part` → ② 整体校验（路径归一拒绝 `..`/绝对路径/反斜杠/盘符、拒绝符号链接、
        单条目 ≤512MiB、总量 ≤2GiB、条目数 ≤50000、路径去重、必须含 `backup-manifest.json` 且含 `main.db`、schema 1..1）
        → ③ 解压到独立暂存目录 `data/restore-staging-<ts>` → ④ 校验清单与 `main.db` 可读。
        任一步失败即 `RemoveAll(staging)` 清理。返回 `staging_path` + `requires_restart=true`，替换由停机运维执行。
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: 恢复校验通过，返回暂存路径
          content:
            application/json:
              schema:
                type: object
                properties:
                  staging_path: { type: string, description: 暂存目录绝对路径 }
                  entries: { type: integer, description: 解压条目数 }
                  bytes: { type: integer, format: int64 }
                  skipped: { type: integer }
                  requires_restart: { type: boolean, description: 恒为 true（需停机替换） }
                  note: { type: string, description: 启用步骤说明 }
        "400": { description: 非 zip / 空体 / 非法 zip / 缺清单 / schema 越界 / 路径穿越条目 / 符号链接 / 超体积 }
        "401": { description: 未鉴权 }
        "403": { description: 非 owner 角色 }
        "503": { description: 备份子系统未接入 }

components:
  Rollback:
    type: object
    description: 一次回滚事件（审计 + reapply 依据；G/S10）
    properties:
      id: { type: string }
      mode: { type: string, enum: [tool, turn, message] }
      target: { type: string, description: 工具事件 ID / run_id / 消息 seq（文本） }
      affected:
        type: array
        description: 参与回滚的工具事件快照对
        items:
          type: object
          properties:
            tool_event_id: { type: string }
            run_id: { type: string }
            snapshot_before: { type: string }
            snapshot_after: { type: string }
            paths: { type: array, items: { type: string } }
      hidden_from_seq: { type: integer, format: int64, description: 消息级回滚的置灰起点（0=未置灰） }
      restored:
        type: array
        description: 物理写回结果
        items:
          type: object
          properties:
            path: { type: string }
            action: { type: string, enum: [restored, deleted] }
            bytes: { type: integer, format: int64 }
      created_at: { type: integer, format: int64 }
      reapplied_at: { type: integer, format: int64, nullable: true }
  Snapshot:
    type: object
    description: 全局快照锚点行（内容本体在 data/snapshots/blobs CAS；G/S10）
    properties:
