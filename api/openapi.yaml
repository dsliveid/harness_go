openapi: 3.0.3
info:
  title: harness-go API
  version: 1.0.0
  description: |
    harness-go 单二进制服务的 HTTP 契约（**单一真源**：docs/开发实施计划.md §6 第 3 类协议）。

    冻结规则：
    - 本文件是前后端唯一物理边界，禁止口头约定字段；
    - 阶段 A 冻结后**只允许向后兼容的新增字段**；
    - 破坏性变更流程：改本文件 → 重新生成/校对 `web/src/lib/apiTypes.ts` → 双端同步。

    通用约定：
    - 鉴权：`Authorization: Bearer <token>` 或 Cookie `hg_sess`（HttpOnly, SameSite=Lax）。
    - 错误体统一：`{"error":{"code","message","trace_id","details"}}`，`trace_id` 与日志一致。
    - 时间戳一律为 Unix 毫秒（int64）。
    - 分页列表统一返回 `{"items":[...],"limit":N,"offset":M}`。
    - `Cache-Control: no-store`；SSE 端点除外（`no-cache`）。
servers:
  - url: /
    description: 同源部署（单二进制内置前端）
tags:
  - name: auth
    description: 认证与免登
  - name: sessions
    description: 会话
  - name: runs
    description: Run 与事件流
  - name: tools
    description: 工具契约与注入预算
  - name: ops
    description: 运维
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [ops]
      summary: 健康检查（免鉴权）
      security: []
      responses:
        "200":
          description: 服务状态与协议版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  protocol_version: { type: integer, example: 1 }
                  uptime_s: { type: integer }
  /:
    get:
      tags: [auth]
      summary: SPA 入口（同时承担 SSO 免登拦截与凭据剥离）
      description: |
        带 `user_name` 查询参数时：校验凭据 → `Set-Cookie` → **302 到不含凭据的干净 URL**；
        校验失败 302 `/?sso_error=1`（不区分「用户不存在/口令错误」）。
      security: []
      parameters:
        - name: user_name
          in: query
          schema: { type: string }
        - name: pwd
          in: query
          schema: { type: string }
        - name: ts
          in: query
          description: signed 模式的时间戳（|now-ts| ≤ 60s）
          schema: { type: integer }
        - name: sign
          in: query
          description: signed 模式的 HMAC-SHA256(user_name + "\n" + ts + "\n" + ip)
          schema: { type: string }
      responses:
        "302":
          description: 重定向到干净 URL（登录成功）或 /?sso_error=1（失败）
        "200":
          description: 未带凭据时返回前端静态资源
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 账号口令登录（返回令牌并写 Cookie）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string, description: 明文令牌仅此一次返回 }
                  expires_at: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/sso:
    post:
      tags: [auth]
      summary: SSO 免登（前端兜底的 URL 自愈路径）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name: { type: string }
                pwd: { type: string, format: password }
                ts: { type: integer }
                sign: { type: string }
      responses:
        "200":
          description: 免登成功（写 Cookie）
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户（首屏静默探测，避免闪登录页）
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（吊销当前令牌并清 Cookie）
      responses:
        "204": { description: 已退出 }
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 修改口令
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: 修改成功 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/webview-ticket:
    post:
      tags: [auth]
      summary: 签发一次性 WebView 免登票据
      description: |
        **需要用户会话**（不在 internal/api/router.go:10-21 的 publicPaths 内）。

        背景：移动端壳的凭据在 Keychain，WebView 的 Cookie jar 是独立的。不做交换，用户每次进 WebView
        都要重登；而直接把 `device_token` 注入页面又违反红线 R3/R9。故引入「一次性短时 ticket」：
        原生（已登录）签发 ticket → 以 URL fragment 传给 WebView 页面 → 页面调 exchange 兑换 `hg_sess`
        降级会话（internal/api/webview_ticket_handler.go:14-27）。

        三条硬约束：
        1. **一次性消费**：重放必须 401；
        2. **绝不写日志**：ticket 明文不得出现在任何日志输出中（服务端只记「已签发」与长度）；
        3. **权限降级**：兑换出的会话带 `webview` 标记（token kind=webview），高危审批决策被拒。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  description: 可选；仅用于日志与审计溯源，不参与 ticket 兑换校验
                ttl_s:
                  type: integer
                  description: |
                    可选有效期（秒）。缺省、0 或负值取默认 60s。
                    ⚠️ 客户端**只能请求更短**：请求值 > 60s 时服务端仍返回 60s（不报错）；
                    代码里另有 300s 硬上限 `webviewTicketMaxTTL`，但在当前实现下不可达
                    （webview_ticket_handler.go:155-165）。
      responses:
        "200":
          description: 签发成功（ticket 明文仅此一次返回）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebviewTicket" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 票据生成失败（crypto/rand 系统级异常，`error.code=internal`）
  /api/v1/auth/webview-exchange:
    post:
      tags: [auth]
      summary: 凭 ticket 兑换降级会话 Cookie（免鉴权）
      description: |
        **免鉴权**：在 internal/api/router.go:17-20 的 publicPaths 内——WebView 首屏尚无任何 Cookie，
        ticket 本身即凭据（32 字节随机值 + 默认 TTL 60s + 一次性消费，强度与端侧配对码同级）。

        成功时**不返回令牌**，而是写 `hg_sess` Cookie（Path=/，HttpOnly，SameSite=Lax，
        MaxAge=SessionTTL），该会话 token kind=`webview`——降级语义：可读会话、看消息、会话内发消息，
        **禁止审批决策**（decideApproval 处校验并拒绝）。

        失败不区分「不存在 / 已过期 / 已使用」，统一 401 `unauthorized`（防探测）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebviewExchangeReq" }
      responses:
        "200":
          description: 兑换成功（凭据通过 Set-Cookie 下发，响应体无令牌）
          headers:
            Set-Cookie:
              description: 降级会话 Cookie：`hg_sess=<token>; Path=/; HttpOnly; SameSite=Lax`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebviewExchangeResp" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 会话列表（**只读主库摘要列**，绝不扫会话库）
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 会话分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [sessions]
      summary: 新建会话（只写主库，首条消息才建 session.db）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                model_ref: { type: string }
                project_dir: { type: string }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: 会话详情
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sessions]
      summary: 更新会话（重命名 / 会话级模型 / 访问模式）
      description: |
        title、model_ref、access_mode 均可选：title 非空时重命名；model_ref 传 null 之外任意值
        （含空串）即更新会话级模型，空串表示「未选择」（省略字段则不改动模型）；
        access_mode 非空时更新访问模式（confirm/full），引擎每次审批实时重读，运行中切换立即生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                model_ref:
                  type: string
                  description: 会话级模型引用（providerID/modelID）；空串 = 未选择
                access_mode:
                  type: string
                  enum: [confirm, full]
                  description: 访问模式（变更前确认/完全访问）；非法值 400
      responses:
        "204": { description: 已更新 }
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [sessions]
      summary: 删除会话（主库软删 + 会话目录回收）
      responses:
        "204": { description: 已删除 }
  /api/v1/sessions/{sid}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: 归档会话（落库 sessions.archived_at；侧栏默认列表不再显示，归档中心可见；幂等）
      responses:
        "204": { description: 已归档 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sid}/unarchive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: 取消归档（回到原分组；幂等）
      responses:
        "204": { description: 已取消归档 }
        "404":
          $ref: "#/components/responses/NotFound"
  # ============ 项目域（项目为服务端一等实体：默认控制权限 + 项目审批规则） ============
  /api/v1/projects:
    get:
      tags: [projects]
      summary: 项目列表（置顶优先，其次更新时间倒序）
      responses:
        "200": { description: 项目列表（items） }
    post:
      tags: [projects]
      summary: 新建项目（default_access_mode 缺省为 confirm）
      responses:
        "201": { description: 已创建 }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/projects/{pid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 取单个项目
      responses:
        "200": { description: 项目 }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      summary: 更新项目（名称 / 默认控制权限 / 置顶；缺省字段保留原值）
      responses:
        "204": { description: 已更新 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      summary: 删除项目（事务级联：软删 + 清规则 + 会话 project_id 归零）
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{pid}/approval-rules:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 项目审批规则列表
      responses:
        "200": { description: 规则列表（items） }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [projects]
      summary: 新增项目审批规则（命中即直接放行；重复添加幂等）
      responses:
        "201": { description: 已创建 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{pid}/approval-rules/{rid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
      - name: rid
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [projects]
      summary: 删除项目审批规则
      responses:
        "204": { description: 已删除 }
        "404":
          $ref: "#/components/responses/NotFound"
  # ============ 工作空间域（执行面一等实体：能力天花板依据；kind 创建后不可改） ============
  # 路由来源：internal/api/router.go:75-79；handler：internal/api/workspace_handler.go
  # 未装配工作空间域时统一 503 unavailable（与 Projects/Webhooks 等可选子系统约定一致）。
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: 工作空间列表（服务端内置空间排最前，其余按创建时间升序）
      description: |
        返回体固定为 `{"items":[...]}` 包裹，**不是分页结构**（无 limit/offset）。
        online / host 为 service 层运行时派生字段，从不落库。
      responses:
        "200":
          description: 工作空间列表（items）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [workspaces]
      summary: 新建工作空间（name 缺省取 kind；同一设备只允许一个工作空间）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceReq" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/workspaces/{wid}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [workspaces]
      summary: 工作空间详情
      responses:
        "200":
          description: 工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [workspaces]
      summary: 更新工作空间（绑定/解绑设备、改名、改根目录）
      description: |
        name / device_id / root_path 全部可选，缺省 = 不改；服务端用 *string 承接以区分
        「未传」与「传空串」。

        **device_id 的三种语义（本端点同时承担绑定与解绑）**：

        | 传入值 | 语义 | 校验 |
        | --- | --- | --- |
        | 不传 | 不改归属 | — |
        | `""`（空串） | **解绑** | 🚨 **不校验设备存在性/在线/吊销** |
        | 设备 ID | **绑定** | 设备存在 + kind 匹配 + 该设备未被其他空间占用 |

        🚨 解绑为何不校验设备：设备被吊销或物理删除后，空间仍指向那台设备。若解绑也要求
        设备存在，该空间将「因已绑定而不能删」且「因设备不存在而不能解绑」，成为永久僵尸。
        解绑是唯一逃生通道，必须无条件放行。

        🚨 kind 不可修改：传入与原值相同的 kind 幂等通过，**与原值不同立即 400**
        （kind 是能力天花板依据，改 kind 等于提权）。

        🚨 内置服务端空间 `ws-server` 的 device_id 是**只读锚点**：任何改变它的请求
        （绑定或解绑）都返回 400。它的执行面恒为服务端本地，一旦绑上设备，
        `executionDeviceID` 会把工具派发到该设备，内置空间语义立即崩塌。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceReq" }
      responses:
        "200":
          description: 更新后的工作空间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [workspaces]
      summary: 删除工作空间（migrate_refs=true 时迁移引用后物理删除）
      description: |
        两种语义，由 `migrate_refs` 决定：

        - **缺省 / false（严格模式）**：仍被会话/项目引用，或目标是内置服务端空间
          `ws-server` 时返回 409，不做级联；
        - **true（确认移除语义，Web 管理端使用）**：服务端在**同一主库事务**内把归属该空间的
          `sessions` 与 `projects` 一并软删、清掉这些项目的 `project_approval_rules`，
          最后**物理删除**工作空间行，返回 204。此后 `GET /workspaces` 不再返回该空间
          （**刷新不会再出现**），其会话/项目也不再出现在列表里。事务提交后服务端还会
          清理 `sessions/<sid>` 物理目录（失败留孤儿，由启动清理兜底）。

        🚨 为什么不能「把引用迁到内置 ws-server」：后者的能力天花板是 `full`（可写文件 +
        执行命令），而原空间可能是 `mobile`（readonly）或设备离线（none）。迁过去会把这些
        会话的写与命令静默改到服务端执行，属**提权**，违反 D8「设备操作不得降级到服务端本地」。
        级联删除从根上消除了这条路径。

        🚨 **仍绑定设备（`device_id != ''`）的工作空间在两种模式下都返回 409**，
        错误码 `conflict`，文案「该工作空间仍绑定设备，请先解绑归属后再删除」。
        `migrate_refs=true` **不能**绕过它 —— 迁移引用解决不了「空间还挂着某台机器」，
        必须由用户先显式解绑（`PATCH {"device_id":""}`）。该校验同时存在于严格删除与
        级联删除两条路径（后者在事务内校验，避免 TOCTOU）。

        内置 `ws-server` 在两种模式下都 409（它是历史回填兜底，删掉会让既有引用悬空）。
      parameters:
        - name: migrate_refs
          in: query
