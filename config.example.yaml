# ============================================================================
# harness-go 配置文件示例
# ============================================================================
# 用法：
#   1) 复制为 data/config.yaml（默认加载路径，二进制会自动读取）
#         mkdir -p data && cp config.example.yaml data/config.yaml
#   2) 或启动时显式指定：
#         ./bin/harness-go -config ./config.example.yaml
#         HARNESS_CONFIG=./my.yaml ./bin/harness-go
#
# 优先级（高 → 低）：
#   命令行 flag > 环境变量 HARNESS_* > data/config.yaml > 内置默认值
#
# 铁律：**本文件不做静默兜底**。任一项写错（非法枚举、必须 >0 写成 0、
#       dynamic_min_top_k > dynamic_top_k、offline_after_s <= heartbeat_s 等）
#       都会在启动时硬报错退出，而不是悄悄改成默认值继续跑。
#       看到「config: xxx 非法」的报错，请回到本文件核对对应字段。
#
# 下方所有值均等于程序内置默认值 —— 即不写任何配置文件时的实际行为。
# ============================================================================

# ---------------------------------------------------------------------------
# server — HTTP 监听参数
# ---------------------------------------------------------------------------
server:
  # 监听地址。默认只绑本机回环（127.0.0.1），避免无意暴露到局域网。
  # 需要让同网段的手机/平板访问时改成 "0.0.0.0:5611"，
  # 但请先确认部署形态与账号口令强度（非 local 形态请务必开 SSO signed）。
  # 端口 5611 与前端本地替身（demo/serve.cjs、vite preview）一致，便于记忆。
  addr: "127.0.0.1:5611"

  # 请求读取超时（秒）
  read_timeout_s: 30

  # 响应写入超时（秒）。**必须为 0 或足够大**：
  # SSE 长连接（/api/v1/sessions/{sid}/runs/{rid}/events）会被写超时直接掐断，
  # 表现为「流式回复跑到一半就断」。默认 0 = 不限制。
  write_timeout_s: 0

# ---------------------------------------------------------------------------
# deployment — 部署形态（决定内置工具开关、是否允许 stdio MCP、鉴权强度）
# ---------------------------------------------------------------------------
deployment:
  # local  : 本地单机（一等公民），SSO plain 可用，默认形态
  # server : 内网自托管，强制 SSO 走 signed（Validate 中自动改写 plain → signed）
  # cloud  : 云端多租户（预留），恒禁止 stdio MCP
  mode: local

# ---------------------------------------------------------------------------
# data — 数据目录（主库 / 会话库 / blob / 日志 / 初始口令都在其下）
# ---------------------------------------------------------------------------
data:
  # 目录不存在会自动创建。目录结构与多库布局见 docs/数据存储方案.md：
  #   data/main.db                     跨会话共享的主库
  #   data/sessions/<sid>/session.db   每会话独立库（懒建）
  #   data/sessions/<sid>/blobs/       会话级 CAS（附件/产物/大工具输出）
  #   data/snapshots/blobs/            全局 CAS（文件快照，跨会话去重）
  #   data/app.log                     日志（GET /api/v1/logs 尾行读它）
  #   data/initial_password            首启随机口令（0600，仅生成一次）
  #   data/initial_token               首启 API 令牌（0600，直接可用于 curl -H @file）
  dir: "./data"

# ---------------------------------------------------------------------------
# auth — 账号与单点登录（SSO 免登入口）
# ---------------------------------------------------------------------------
auth:
  # 是否启用 SSO 免登入口（GET /?user_name=xxx&pwd=xxx）
  # local 默认开启（便于 AI 调试 / 内网门户跳转）；server、cloud 会被强制关闭。
  sso_enabled: true

  # plain  : 直接校验 user_name + pwd（local 默认）
  # signed : sign = HMAC-SHA256(user_name + "\n" + ts + "\n" + ip, sso_secret)
  #          且 |now-ts| <= 60s 防重放，密码可完全不出现在 URL（server/cloud 推荐）
  # both   : 迁移期两种都接受
  sso_mode: plain

  # signed / both 模式的 HMAC 密钥。留空时该模式不可用（签名一律校验失败）。
  # 建议用长随机串，例如：openssl rand -hex 32
  sso_secret: ""

  # web 会话有效期（小时）。默认 168 = 7 天。
  # 会话令牌存 api_tokens 表（kind=web_session），Cookie 名 hg_sess（HttpOnly）。
  session_ttl_h: 168

  # 首启引导账号（**仅在没有任何用户时生效**，之后改这里不影响已有账号）
  initial_user: "admin"

  # 首启引导口令。留空 → 随机生成并写入 data/initial_password（权限 0600），
  # 日志里不会打印口令本身。出厂**禁止**使用弱口令，故不建议在这里写死简单密码。
  initial_pwd: ""

# ---------------------------------------------------------------------------
# storage — 存储与 CAS（内容寻址大对象）
# ---------------------------------------------------------------------------
storage:
  # 同时打开的会话库上限（LRU 连接池）。超过则淘汰最久未用的会话库，
  # 淘汰前会 wal_checkpoint(TRUNCATE)，避免长期运行堆积海量 -wal/-shm。
  # 调大 → 跨会话切换更快，但文件句柄与内存占用上升。
  max_open_sessions: 8

  # 单个 blob 上限（MB）。超限写入直接报错 storage.blob_too_large，不做截断。
  max_blob_mb: 64

  # data 目录配额告警阈值（GB）。仅告警，不阻断写入。
  data_quota_gb: 8

  # 会话库闲置多久后从连接池淘汰（分钟）
  idle_evict_min: 10

  # 全局快照 blob 的 GC 宽限期（小时）：ref_count=0 且超过该时长才回收，
  # 防止「刚创建还没被引用的快照」被误删。
  blob_gc_grace_h: 24

# ---------------------------------------------------------------------------
# tools — 工具注入（Token 治理，见 D11：Tier 三档 core / deferred / on_demand）
# ---------------------------------------------------------------------------
tools:
  # core 档（基础工具，全量注入定义）条数的**软上限**：超过只在启动日志与 UI 告警，
  # 绝不阻断启动。注意总 token 成本随条数线性上升，且每轮都要付。
  core_soft_limit: 8

  # deferred 档（按需，只有名称 + 一行描述进索引）条数软上限
  deferred_soft_limit: 60

  # 每轮动态检索后注入「全量定义」的 deferred 工具条数（推荐 4~8）。
  # 必须 > 0：写 0 会让按需工具完全不可见，退化成比全量注入更糟的形态 → 启动报错。
  dynamic_top_k: 6

  # 预算降级（topK 减半）时允许的最小条数。必须 > 0 且不能大于 dynamic_top_k。
  # 砍到 0 等于降级后按需工具彻底消失 → 启动报错。
  dynamic_min_top_k: 2

# ---------------------------------------------------------------------------
# devices — 多端协同（HALO）设备域
# ---------------------------------------------------------------------------
devices:
  # 设备域总开关（关闭后 /api/v1/devices* 与 /api/v1/devices/ws 返回 unavailable）
  enabled: true

  # 配对码有效期（秒）。铁律值 120s：短到无法被暴力枚举，长到够手工输入。
  pair_ttl_s: 120

  # 端侧主动 ping 间隔（秒）。会经 WS welcome 帧下发给端侧。
  heartbeat_s: 15

  # 多久收不到任何帧就判离线（秒）。**必须大于 heartbeat_s**，否则端侧会在
  # 两次心跳的正常间隙里被判离线，表现为反复上下线抖动。推荐 3 × heartbeat。
  offline_after_s: 45

  # 任务派发超时（秒）
  task_ttl_s: 600

  # 高风险工具审批是否仅限「执行端设备」确认。
  # false（默认）= 只记审计不阻断；true = 必须由执行端本人点确认。
  strict_approval_device: false

# ---------------------------------------------------------------------------
# agent — Agent 执行循环（步数预算与进度提示）
# ---------------------------------------------------------------------------
agent:
  # 单次 Run 的最大执行步数（一轮「模型输出 + 工具执行」算一步）。
  # 默认 100。此前该值在代码中硬编码为 20，复杂任务（如全仓结构勘察）
  # 在第 20 步被硬性截断，runs 表终态为 max_steps_exceeded。
  #
  # ⚠️ 注意：步数越多，单次 Run 的耗时与 token 消耗越大。长任务建议配合
  # budget.max_total 一起设限，避免无边界消耗。
  max_steps: 100

  # 每 N 步向模型注入一次「当前步数 X/总步数 N」进度提示，让模型感知
  # 剩余预算、在接近上限时主动收敛输出。
  # 默认 10；设为 0 表示关闭该提示（模型将完全不知道步数预算）。
  # 该提示走「动态段置尾」通道注入，不进 system 稳定前缀，不影响前缀缓存。
  step_notice_every: 10

# ---------------------------------------------------------------------------
# budget — 预算闸门（Token 治理的硬边界）
# ---------------------------------------------------------------------------
budget:
  # 单 Run 的总 token 预算。0 = 不限（闸门直通，零开销）。
  # > 0 时超限触发五级降级：省记忆 → topK 减半 → 常驻工具降到 4
  # → 旧工具结果转引用 → 强制压缩；五级用尽仍超则 Run 明确失败（budget_exhausted），
  # **严禁静默截断**。
  max_total: 0

  # 历史段占总预算的比例上限，取值 (0,1]。超出部分从最旧开始裁剪
  # （属预算内正常裁剪，有 DroppedHistory 计数，与「降级用尽后报错」是两条路径）。
  # 仅 max_total > 0 时生效。
  history_ratio: 0.6

# ---------------------------------------------------------------------------
# mcp — 外部插件接入（MCP + 工具市场）
# ---------------------------------------------------------------------------
mcp:
  # 外部插件总开关（关闭时相关端点返回 unavailable）
  enabled: true

  # server 形态是否显式放行 stdio 传输（起子进程）。
  # cloud 形态恒禁止（Validate 硬约束）；local 不需要启用即可用 stdio。
  allow_stdio: false

  # 受信 ed25519 公钥（64 位 hex），安装签名包的信任根。
  # 为空 → 任何签名都无法通过校验 → 签名包一律硬拒（无法证明来源）。
  # 示例：trusted_keys: ["a1b2...64位hex..."]
  trusted_keys: []

  # 是否允许安装未签名包。默认 false（出口铁律：未签名包拒绝安装）。
  allow_unsigned: false

# ---------------------------------------------------------------------------
# log — 日志
# ---------------------------------------------------------------------------
log:
  # debug | info | warn | error
  #
  # 默认 warn：控制台与 data/app.log 共用同一个 logger，info 级会把启动流水账与
  # 请求访问日志刷满控制台。需要排查时无需改本文件重启——在「设置 → 日志查询」
  # 里切换级别即可（PATCH /api/v1/logs/config，slog.LevelVar 热生效，控制台与
  # 日志文件同步变化）。
  level: warn

  # text（人读） | json（结构化，便于采集）
  format: text
